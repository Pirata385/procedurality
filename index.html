/* ============================== CHARTS =================================== */
const Charts = {
  spark(c, vals, col) {
    const w = c.clientWidth || 300, h = c.clientHeight || 54, dpr = Math.min(2, App.dpr);
    c.width = w * dpr; c.height = h * dpr;
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
    const px = (i) => (i / (vals.length - 1)) * w, py = (v) => h - 4 - ((v - mn) / rg) * (h - 10);
    x.beginPath(); vals.forEach((v, i) => (i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))));
    x.strokeStyle = col; x.lineWidth = 1.6; x.stroke();
    x.lineTo(w, h); x.lineTo(0, h); x.closePath();
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, col.replace('rgb', 'rgba').replace(')', ',0.35)')); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(w - 2, py(vals[vals.length - 1]), 2.5, 0, TAU); x.fill();
  },
  dna(c, g) {
    const w = c.clientWidth || 300, rows = 4, per = 48, h = rows * 14 + 6, dpr = Math.min(2, App.dpr);
    c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    const s = Life.dnaString(g), cols = { A: '#7dffb0', C: '#5ee7ff', G: '#ffb45e', T: '#ff6b8a' };
    const bw = (w - 12) / per;
    for (let i = 0; i < s.length; i++) {
      const r = Math.floor(i / per), k = i % per;
      x.fillStyle = cols[s[i]];
      x.fillRect(6 + k * bw + 0.5, 4 + r * 14, Math.max(1, bw - 1), 10);
      if (k % 4 === 0 && k) { x.fillStyle = 'rgba(0,0,0,0.5)'; x.fillRect(6 + k * bw - 0.5, 4 + r * 14, 1, 10); }
    }
  },
  foodWeb(c, eco, onPick) {
    const w = c.clientWidth || 320, dpr = Math.min(2, App.dpr);
    const levels = [0, 1, 2, 3];
    const byL = levels.map(() => []);
    for (const s of eco.species) byL[s.tl >= 2.6 ? 3 : s.tl >= 1.8 ? 2 : s.tl >= 0.9 ? 1 : 0].push(s);
    const used = byL.filter((l) => l.length);
    const h = Math.max(140, used.length * 62 + 20);
    c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    const pos = new Map();
    used.forEach((row, ri) => row.forEach((s, i) => pos.set(s.idx, [((i + 0.5) / row.length) * w, h - 26 - ri * ((h - 46) / Math.max(1, used.length - 1))])));
    for (const e of eco.web) {
      const a = pos.get(e.from), b = pos.get(e.to);
      if (!a || !b) continue;
      x.strokeStyle = e.kind === 'eats' ? 'rgba(125,255,176,0.28)' : e.kind === 'carrion' ? 'rgba(255,180,94,0.3)' : 'rgba(155,232,255,0.22)';
      x.lineWidth = 1.2; x.beginPath(); x.moveTo(a[0], a[1]); x.bezierCurveTo(a[0], (a[1] + b[1]) / 2, b[0], (a[1] + b[1]) / 2, b[0], b[1]); x.stroke();
    }
    for (const s of eco.species) {
      const [px, py] = pos.get(s.idx);
      x.fillStyle = C.css(s.ph.primary); x.strokeStyle = s.sapient ? '#ffd35e' : 'rgba(255,255,255,0.6)'; x.lineWidth = s.sapient ? 2 : 1;
      x.beginPath(); x.arc(px, py, 7, 0, TAU); x.fill(); x.stroke();
      x.fillStyle = 'rgba(210,222,255,0.8)'; x.font = `10px ${App.font}`; x.textAlign = 'center';
      const nm = s.common.length > 16 ? s.common.split(' ').slice(-1)[0] : s.common;
      x.fillText(nm, px, py + 18);
    }
    c.onclick = (e) => {
      const r = c.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      for (const s of eco.species) { const [px, py] = pos.get(s.idx); if (Math.hypot(px - mx, py - my) < 12) return onPick(s); }
    };
  },
};

/* ============================== CLOCK ====================================
   Universal time is derived from the wall clock: one real second is one
   universe hour. The universe therefore keeps evolving while nobody is
   watching. Observers may warp or pause their *view* of time; that offset
   is persisted and can be synchronised back to "live" at any moment.
   ======================================================================== */
const Clock = {
  EPOCH: Date.UTC(2025, 0, 1),
  RATE: 1 / 24,
  offset: 0, warp: 1, paused: false,
  live() { return ((Date.now() - this.EPOCH) / 1000) * this.RATE; },
  now() { return this.live() + this.offset; },
  step(dt) {
    if (this.paused) this.offset -= dt * this.RATE;
    else if (this.warp !== 1) this.offset += dt * this.RATE * (this.warp - 1);
  },
  setWarp(w) { this.warp = w; this.paused = false; this.persist(); },
  pause() { this.paused = !this.paused; this.persist(); },
  sync() { this.offset = 0; this.warp = 1; this.paused = false; this.persist(); },
  isLive() { return !this.paused && this.warp === 1 && Math.abs(this.offset) < 1 / 1440; },
  STEPS: [1, 24, 240, 2400, 8766],
  faster() { const i = this.STEPS.indexOf(this.warp); this.setWarp(this.STEPS[Math.min(this.STEPS.length - 1, i + 1)]); },
  slower() { const i = this.STEPS.indexOf(this.warp); this.setWarp(this.STEPS[Math.max(0, i - 1)]); },
  warpLabel() { return { 1: '1 h/s', 24: '1 d/s', 240: '10 d/s', 2400: '100 d/s', 8766: '1 yr/s' }[this.warp] || `${this.warp}×`; },
  format(t) {
    const year = Math.floor(t / 365.25) + 1, day = Math.floor(t - (year - 1) * 365.25) + 1, fr = U.fract(t) * 24;
    return { year, day, hh: String(Math.floor(fr)).padStart(2, '0'), mm: String(Math.floor((fr % 1) * 60)).padStart(2, '0') };
  },
  persist() { if (Store.data) { Store.data.time = { offset: this.offset, warp: this.warp, paused: this.paused }; Store.save(); } },
};

/* ============================== INPUT ==================================== */
const Input = {
  pts: new Map(), keys: new Set(),
  init(el) {
    this.el = el;
    el.addEventListener('pointerdown', (e) => this.down(e));
    el.addEventListener('pointermove', (e) => this.move(e));
    el.addEventListener('pointerup', (e) => this.up(e));
    el.addEventListener('pointercancel', (e) => this.up(e, true));
    el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !this.pts.size) { UI.tip.hide(); } });
    el.addEventListener('wheel', (e) => this.wheel(e), { passive: false });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', (e) => { if (e.target === el) e.preventDefault(); });
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => this.keys.clear());
  },
  down(e) {
    if (App.transitioning()) return;
    this.el.setPointerCapture(e.pointerId);
    App.touch = e.pointerType !== 'mouse';
    const now = performance.now();
    this.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pts.size === 1) { this.start = { x: e.clientX, y: e.clientY, t: now }; this.moved = false; this.multi = false; this.vel = { x: 0, y: 0 }; this.last = { t: now }; }
    else if (this.pts.size === 2) { this.multi = true; const [a, b] = [...this.pts.values()]; this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
    UI.tip.hide();
    UI.el.warpMenu.classList.remove('open');
  },
  move(e) {
    const p = this.pts.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse' && !App.transitioning()) App.view.onHover(e.clientX, e.clientY); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    const now = performance.now();
    if (this.pts.size === 1 && !this.multi) {
      if (!this.moved && Math.hypot(e.clientX - this.start.x, e.clientY - this.start.y) > (App.touch ? 9 : 4)) { this.moved = true; this.el.classList.add('dragging'); UI.tip.hide(); }
      if (this.moved) {
        App.view.onPan(dx, dy);
        const dt = Math.max(1, now - this.last.t) / 1000;
        this.vel.x = U.lerp(this.vel.x, dx / dt, 0.35); this.vel.y = U.lerp(this.vel.y, dy / dt, 0.35);
        this.last.t = now;
      }
    } else if (this.pts.size >= 2) {
      const [a, b] = [...this.pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      App.view.onZoom(d / this.pinch.d, mx, my);
      App.view.onPan(mx - this.pinch.mx, my - this.pinch.my);
      this.pinch = { d, mx, my };
    }
  },
  up(e, cancel) {
    if (!this.pts.delete(e.pointerId)) return;
    const now = performance.now();
    if (this.pts.size === 0) {
      this.el.classList.remove('dragging');
      if (!cancel && !this.moved && !this.multi && now - this.start.t < 600) {
        const x = e.clientX, y = e.clientY;
        if (this.lastTap && now - this.lastTap.t < 340 && Math.hypot(x - this.lastTap.x, y - this.lastTap.y) < 34) { this.lastTap = null; App.view.onDoubleTap(x, y); }
        else { this.lastTap = { x, y, t: now }; App.view.onTap(x, y); }
      } else if (this.moved && !this.multi && now - this.last.t < 90) {
        const sp = Math.hypot(this.vel.x, this.vel.y);
        if (sp > 60) App.view.onFling(this.vel.x, this.vel.y);
      }
    } else if (this.pts.size === 1) {
      const [p] = [...this.pts.values()];
      this.start = { x: p.x, y: p.y, t: now }; this.moved = true; this.vel = { x: 0, y: 0 };
    }
  },
  wheel(e) {
    e.preventDefault();
    if (App.transitioning()) return;
    let dy = e.deltaY * (e.deltaMode === 1 ? 18 : e.deltaMode === 2 ? 120 : 1);
    if (e.ctrlKey) dy *= 2.5;
    App.view.onZoom(Math.exp(U.clamp(-dy * 0.0017, -0.6, 0.6)), e.clientX, e.clientY);
  },
  key(e, down) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (down && e.key === 'Escape') e.target.blur(); return; }
    const k = e.key;
    if (!down) { this.keys.delete(k.toLowerCase()); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (k === 'Escape') { if (!UI.modal.close()) App.back(); return; }
    if (UI.modal.isOpen) return;
    const lk = k.toLowerCase();
    if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'].includes(lk)) { this.keys.add(lk); e.preventDefault(); return; }
    switch (k) {
      case '+': case '=': App.view.zoomBy(1.4); break;
      case '-': case '_': App.view.zoomBy(1 / 1.4); break;
      case '/': e.preventDefault(); UI.openSearch(); break;
      case 'g': case 'G': UI.openLab(); break;
      case 'c': case 'C': UI.openCodex(); break;
      case '?': case 'h': case 'H': UI.openHelp(); break;
      case 'b': case 'B': { const bm = UI.panel.spec && UI.panel.spec.bookmark; if (bm) { Store.toggleBookmark(bm); UI.panel.set(UI.panel.spec); } else UI.openDiscoveries(); break; }
      case ' ': e.preventDefault(); Clock.pause(); UI.updateClock(true); break;
      case '.': case '>': Clock.faster(); UI.updateClock(true); break;
      case ',': case '<': Clock.slower(); UI.updateClock(true); break;
      case 'l': case 'L': Clock.sync(); UI.updateClock(true); UI.toast('Synchronised with the living universe'); break;
      case 'p': case 'P': UI.togglePanel(!UI.el.panel.classList.contains('collapsed')); break;
      case 'Backspace': App.back(); break;
      case 'Enter': App.view.onKey('Enter'); break;
    }
  },
  applyKeys(dt) {
    if (!this.keys.size) return;
    let dx = 0, dy = 0;
    const s = 520 * dt;
    if (this.keys.has('arrowleft') || this.keys.has('a')) dx += s;
    if (this.keys.has('arrowright') || this.keys.has('d')) dx -= s;
    if (this.keys.has('arrowup') || this.keys.has('w')) dy += s;
    if (this.keys.has('arrowdown') || this.keys.has('s')) dy -= s;
    if (dx || dy) App.view.onPan(dx, dy);
  },
};

/* ============================== TRANSITIONS ============================== */
const Transition = {
  t: 1, dir: 0,
  start(src, dir, focus) {
    if (App.settings.reduceMotion) return;
    const c = this.snap || (this.snap = document.createElement('canvas'));
    c.width = src.width; c.height = src.height;
    c.getContext('2d').drawImage(src, 0, 0);
    this.t = 0; this.dir = dir;
    this.f = focus || [App.vp.cx, App.vp.cy];
  },
  active() { return this.t < 1; },
  draw(ctx, dt) {
    if (this.t >= 1) return;
    this.t = Math.min(1, this.t + dt / 0.6);
    const e = U.easeOut(this.t), [fx, fy] = this.f;
    ctx.save();
    ctx.globalAlpha = 1 - e;
    const s = this.dir > 0 ? 1 + e * 2.4 : this.dir < 0 ? 1 - e * 0.5 : 1;
    ctx.translate(fx, fy); ctx.scale(s, s); ctx.translate(-fx, -fy);
    ctx.drawImage(this.snap, 0, 0, App.W, App.H);
    ctx.restore();
    if (this.dir > 0 && this.t < 0.5) {
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, Math.max(App.W, App.H) * 0.6 * e + 1);
      g.addColorStop(0, `rgba(180,230,255,${0.16 * (1 - this.t * 2)})`); g.addColorStop(1, 'rgba(180,230,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, App.W, App.H);
    }
  },
};

/* ============================== APP ====================================== */
const QUALITY = {
  low: { dpr: 1, globeTex: 512, tileRes: 48, tileBudget: 7, agents: 24, beltParticles: 180, nebRes: 48, jobBudget: 7, nebBudget: 3 },
  medium: { dpr: 1.5, globeTex: 1024, tileRes: 56, tileBudget: 9, agents: 38, beltParticles: 300, nebRes: 64, jobBudget: 9, nebBudget: 4 },
  high: { dpr: 2, globeTex: 1024, tileRes: 64, tileBudget: 11, agents: 52, beltParticles: 460, nebRes: 80, jobBudget: 11, nebBudget: 5 },
};
const App = {
  dpr: 1, W: 0, H: 0, frame: 0, t: 0, realT: 0, realDt: 0.016,
  touch: window.matchMedia && matchMedia('(pointer: coarse)').matches,
  font: getComputedStyle(document.documentElement).getPropertyValue('--font').trim() || 'system-ui, sans-serif',
  mono: 'ui-monospace, Menlo, Consolas, monospace',
  views: {}, view: null,
  boot() {
    Store.load();
    this.settings = Store.data.settings;
    const tm = Store.data.time || {};
    Clock.offset = +tm.offset || 0; Clock.warp = Clock.STEPS.includes(+tm.warp) ? +tm.warp : 1; Clock.paused = !!tm.paused;
    this.applyQuality();
    Galaxy.init(Codes.cleanUni(this.settings.universe) || 'ORIGIN');
    GL.init();
    Builder.init();
    this.canvas = document.getElementById('stage');
    this.ctx = this.canvas.getContext('2d', { alpha: false }) || this.canvas.getContext('2d');
    UI.init();
    Input.init(this.canvas);
    this.views = { galaxy: new GalaxyView(), system: new SystemView(), planet: new PlanetView(), surface: new SurfaceView() };
    this.resize();
    window.addEventListener('resize', () => this.resize());
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.resize());
    window.addEventListener('popstate', () => { const h = location.hash.slice(1); if (h && this.view && h !== this.view.code) this.navigate(h, { noPush: true }); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { Clock.persist(); Store.save(true); } });
    window.addEventListener('pagehide', () => { Clock.persist(); Store.save(true); });
    const hash = location.hash.slice(1);
    let ok = false;
    if (hash) ok = this.navigate(hash, { noPush: true, instant: true });
    if (!ok && Store.data.last) ok = this.navigate(Store.data.last, { noPush: true, instant: true });
    if (!ok) this.navigate(Codes.galaxy(Galaxy.name, 0, 0), { noPush: true, instant: true });
    this.lastTs = performance.now();
    requestAnimationFrame((ts) => this.loop(ts));
    setTimeout(() => {
      document.getElementById('splash').classList.add('gone');
      if (!Store.data.intro) { Store.data.intro = true; Store.save(); UI.openHelp(true); }
    }, 350);
  },
  applyQuality() {
    const auto = this.touch || Math.min(screen.width, screen.height) < 700 ? 'medium' : 'high';
    this.qualityName = auto;
    const q = this.settings.quality === 'auto' ? auto : this.settings.quality;
    this.quality = QUALITY[q] || QUALITY.medium;
  },
  resize() {
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio || 1, this.quality.dpr);
    this.canvas.width = Math.round(this.W * this.dpr); this.canvas.height = Math.round(this.H * this.dpr);
    this.vp = UI.viewport(); this.vpTarget = null;
  },
  /** Panel/sheet changed: glide the unobstructed viewport to its new shape. */
  relayout() { this.vpTarget = UI.viewport(); },
  stepViewport(dt) {
    const t = this.vpTarget;
    if (!t) return;
    const v = this.vp, k = 1 - Math.exp(-dt * 9);
    let done = true;
    for (const key of ['x', 'y', 'w', 'h']) { v[key] += (t[key] - v[key]) * k; if (Math.abs(t[key] - v[key]) > 0.5) done = false; }
    v.cx = v.x + v.w / 2; v.cy = v.y + v.h / 2; v.mobile = t.mobile;
    if (done) { this.vp = t; this.vpTarget = null; }
  },
  setCursor(cls) { this.canvas.classList.toggle('pointing', cls === 'pointing'); },
  transitioning() { return false; },
  setUniverse(name) {
    if (name === Galaxy.name) return;
    Galaxy.init(name);
    World.cache.clear();
    this.settings.universe = name;
    Store.save();
    this.views.galaxy.neb.clear();
  },
  depth(v) { return { galaxy: 0, system: 1, planet: 2, surface: 3 }[v.name]; },
  navigate(code, opts = {}) {
    const loc = Codes.parse(code);
    if (!loc) { UI.toast('Unrecognised location code', 'bad'); return false; }
    if (loc.uni && loc.uni !== Galaxy.name) this.setUniverse(loc.uni);
    let view, params, name, kind;
    if (loc.kind === 'galaxy') { view = this.views.galaxy; params = { x: loc.x, y: loc.y, selectCode: opts.select }; name = Galaxy.regionName(loc.x, loc.y); kind = 'place'; }
    else {
      const sys = World.system(loc.sys);
      if (!sys) { UI.toast('No star exists at that location', 'bad'); return false; }
      if (loc.kind === 'system') { view = this.views.system; params = { sys, select: opts.selectBody }; name = sys.name; kind = 'system'; }
      else {
        const r = World.body(Codes.planet(loc.sys, loc.p, loc.m));
        if (!r) { UI.toast('That world does not exist', 'bad'); return false; }
        if (loc.kind === 'planet') { view = this.views.planet; params = { sys, body: r.body, code: r.code, parent: r.parent, lat: opts.lat, lon: opts.lon }; name = r.body.name; kind = r.body.isMoon ? 'moon' : 'planet'; }
        else { view = this.views.surface; params = { sys, body: r.body, code: r.code, parent: r.parent, lat: loc.lat, lon: loc.lon, z: opts.z }; name = `${r.body.name} surface`; kind = 'surface'; }
      }
    }
    if (!opts.instant && this.view) {
      const d = this.depth(view) - this.depth(this.view);
      Transition.start(this.canvas, d > 0 ? 1 : d < 0 ? -1 : 0, opts.from);
    }
    if (this.view && this.view !== view) this.view.exit();
    UI.tip.hide();
    if (window.innerWidth <= 760 && UI.el.panel.dataset.sheet !== 'peek') UI.el.panel.dataset.sheet = 'peek';
    this.view = view;
    this.vp = UI.viewport(); this.vpTarget = null;
    view.enter(params);
    UI.crumbs(view.crumbs());
    const c = view.code;
    try {
      if (opts.noPush) history.replaceState(null, '', '#' + c);
      else history.pushState(null, '', '#' + c);
    } catch (e) { /* file:// or sandboxed — ignore */ }
    Store.data.last = c;
    Store.pushHistory(c, name, kind);
    return true;
  },
  back() {
    const v = this.view;
    if (v === this.views.surface) this.navigate(v.bodyCode, { lat: v.cam.lat, lon: v.cam.lon });
    else if (v === this.views.planet) {
      const P = v.P;
      this.navigate(v.sys.code, { selectBody: P.isMoon ? `${P.parentIndex}.${P.index}` : `${P.index}` });
    } else if (v === this.views.system) {
      const s = v.sys;
      if (s.custom) this.navigate(Codes.galaxy(Galaxy.name, this.views.galaxy.cam.x, this.views.galaxy.cam.y));
      else this.navigate(Codes.galaxy(Galaxy.name, s.gx, s.gy), { select: s.code, from: null });
    }
  },
  onSurfaceReady(P) { /* hook for views that wait on a survey */ },
  loop(ts) {
    const dt = Math.min(0.1, Math.max(0, (ts - this.lastTs) / 1000));
    this.lastTs = ts;
    this.realDt = dt; this.realT += dt;
    Clock.step(dt);
    this.t = Clock.now();
    Input.applyKeys(dt);
    this.stepViewport(dt);
    const v = this.view;
    Scheduler.run(this.quality.jobBudget);
    try {
      v.update(dt, this.t);
      const ctx = this.ctx;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      v.render(ctx, this.W, this.H, this.t, dt);
      Transition.draw(ctx, dt);
    } catch (e) { console.error(e); }
    UI.tick(dt);
    if (this.frame % 60 === 0) {
      const c = v.code;
      if (location.hash.slice(1) !== c && (v.name === 'surface' || v.name === 'galaxy')) { try { history.replaceState(null, '', '#' + c); } catch (e) {} Store.data.last = c; }
    }
    if (this.frame % 600 === 0) Clock.persist();
    this.frame++;
    requestAnimationFrame((t2) => this.loop(t2));
  },
};

window.addEventListener('DOMContentLoaded', () => {
  try { App.boot(); }
  catch (e) {
    console.error(e);
    const m = document.getElementById('splashMsg');
    if (m) m.textContent = 'Failed to start: ' + e.message;
  }
});
</script>
</body>
