      case 'terran': s.push(`${F.pct(P.liquid)} of the surface lies under ${P.temp < 262 ? 'partly frozen ' : ''}oceans, with ${P.liquid < 0.4 ? 'broad continents and interior deserts' : 'scattered continents and island chains'}.`); break;
      case 'ocean': s.push(`A near-global ocean covers ${F.pct(P.liquid)} of the surface; only volcanic archipelagos break the waves.`); break;
      case 'desert': s.push(P.liquid > 0.01 ? 'Endless dune seas and wind-carved canyons surround a handful of shrinking oases.' : 'Not a drop of surface water remains — only dunes, mesas and salt pans.'); break;
      case 'frozen': s.push(P.biochem === 'ammonia' ? 'Ammonia-water slush pools between glaciers under a dim sky.' : `A thick ice shell covers ${P.tidal ? 'a tidally heated ocean' : 'ancient frozen seas'}, scarred by fractures${P.terrain.cracks > 0.7 ? ' stained rust-red by upwelling salts' : ''}.`); break;
      case 'lava': s.push(`Magma seas cover ${F.pct(P.liquid)} of the surface; the crust is constantly remade by eruptions.`); break;
      case 'barren': s.push('Airless and cratered, its surface records billions of years of impacts.'); break;
      case 'toxic': s.push(`A crushing ${F.n(P.pressure, 0)} atm atmosphere of carbon dioxide traps heat beneath sulfuric clouds.`); break;
      case 'methane': s.push('Hydrocarbon rain feeds methane lakes that ripple beneath an orange smog.'); break;
      case 'carbon': s.push('Its carbon-rich crust forms graphite plains, tar seas and diamond-studded ridges.'); break;
      case 'crystal': s.push('Vast silicate crystal formations rise in faceted spires that refract the starlight.'); break;
      case 'gasgiant': s.push(`Turbulent cloud bands and long-lived storms race around it every ${F.n(P.dayHours, 1)} hours.`); break;
      case 'icegiant': s.push('Methane in its deep atmosphere absorbs red light, giving it a cold azure glow.'); break;
    }
    if (P.locked && !P.isMoon && !P.giant) s.push('It is tidally locked: one hemisphere bakes in eternal day while the other freezes in endless night.');
    if (P.rings) s.push('A broad ring system encircles it.');
    if (P.life === 1) s.push('Microbial life has been detected, tinting sheltered pools and rock pores.');
    if (P.life === 2) s.push('Simple multicellular organisms populate its habitats.');
    if (P.life === 3) s.push('A complex, interdependent ecosystem thrives here.');
    if (P.life === 4) s.push(`A ${TECH_LEVELS[P.tech].toLowerCase()} civilization — the ${F.esc(P.civName)} — has arisen here.`);
    if (P.ruins) s.push('Ancient ruins suggest a vanished civilization once called it home.');
    return s.join(' ');
  },
};

/* ------------------------------ world access ---------------------------- */
const World = {
  cache: new LRU(40),
  /** Resolve a system code (galactic or custom) to a generated system. */
  system(sysCode) {
    let sys = this.cache.get(sysCode);
    if (sys) return sys;
    const loc = Codes.parse(sysCode);
    if (!loc) return null;
    if (loc.custom) {
      const seed = U.hash(U.hstr('custom:' + loc.custom), 0xC057);
      sys = SystemGen.generate(seed, { code: loc.sys, custom: true });
    } else {
      if (loc.uni !== Galaxy.name) return null;
      const st = Galaxy.starAt(loc.sx, loc.sy, loc.k);
      if (!st) return null;
      sys = SystemGen.generate(st.seed, { code: loc.sys, x: st.x, y: st.y });
    }
    return this.cache.set(sysCode, sys);
  },
  body(code) {
    const loc = Codes.parse(code);
    if (!loc || loc.p == null) return null;
    const sys = this.system(loc.sys);
    if (!sys) return null;
    const p = sys.planets[loc.p];
    if (!p) return null;
    const body = loc.m == null ? p : p.moons[loc.m];
    if (!body) return null;
    return { sys, body, parent: loc.m == null ? null : p, code: Codes.planet(loc.sys, loc.p, loc.m), loc };
  },
  bodyCode(sys, P) { return P.isMoon ? Codes.planet(sys.code, P.parentIndex, P.index) : Codes.planet(sys.code, P.index); },
};

/* ============================== SURFACE ==================================
   A PlanetSurface is built progressively (generator → Scheduler):
     1. heightmap   — domain-warped Simplex fBm + ridged mountains + craters
     2. sea level   — area-weighted height quantile matching the liquid fraction
     3. climate     — latitude/elevation temperature, distance-to-sea moisture
     4. hydrology   — priority-flood depression filling (lakes / salt pans)
                      and flow accumulation (river networks)
     5. textures    — albedo, height/emissive/specular data, cloud layer
     6. features    — volcanoes, craters, ruins, cities, reefs, storms…
   The same height() and shade() functions also drive the surface tiles, so
   zooming from orbit to the ground stays perfectly consistent.
   ======================================================================== */
const CC = {
  r: 0, g: 0, b: 0,
  set(c) { this.r = c[0]; this.g = c[1]; this.b = c[2]; },
  mix(c, t) { if (t <= 0) return; if (t > 1) t = 1; this.r += (c[0] - this.r) * t; this.g += (c[1] - this.g) * t; this.b += (c[2] - this.b) * t; },
  mix3(r, g, b, t) { if (t <= 0) return; if (t > 1) t = 1; this.r += (r - this.r) * t; this.g += (g - this.g) * t; this.b += (b - this.b) * t; },
  mul(f) { this.r *= f; this.g *= f; this.b *= f; },
};
const SH = { r: 0, g: 0, b: 0, e: 0, w: 0, biome: 0, water: false };

const FEATURE_TYPES = {
  volcano: { name: 'Mount {W}', label: 'Volcano', icon: 'volcano', color: [255, 120, 60] },
  cryovolcano: { name: '{W} Cryovolcano', label: 'Cryovolcano', icon: 'volcano', color: [150, 220, 255] },
  lavalake: { name: '{W} Caldera', label: 'Lava lake', icon: 'volcano', color: [255, 90, 30] },
  geyser: { name: '{W} Geysers', label: 'Geyser field', icon: 'geyser', color: [170, 230, 255] },
  crater: { name: '{W} Crater', label: 'Impact crater', icon: 'crater', color: [210, 200, 180] },
  canyon: { name: '{W} Canyon', label: 'Canyon system', icon: 'canyon', color: [225, 145, 95] },
  arches: { name: '{W} Arches', label: 'Stone arches', icon: 'arch', color: [232, 172, 122] },
  spires: { name: '{W} Spires', label: 'Crystal spires', icon: 'crystal', color: [150, 240, 255] },
  icespire: { name: '{W} Seracs', label: 'Ice spires', icon: 'crystal', color: [210, 240, 255] },
  monolith: { name: 'The {W} Monolith', label: 'Anomalous monolith', icon: 'monolith', color: [255, 94, 200] },
  ruins: { name: 'Ruins of {W}', label: 'Ancient ruins', icon: 'ruins', color: [255, 211, 94] },
  city: { name: '{W}', label: 'Settlement', icon: 'city', color: [255, 220, 140] },
  tree: { name: 'The {W} Tree', label: 'Colossal tree', icon: 'tree', color: [120, 230, 120] },
  reef: { name: '{W} Reef', label: 'Great reef', icon: 'reef', color: [255, 140, 170] },
  springs: { name: '{W} Springs', label: 'Hot springs', icon: 'springs', color: [120, 220, 210] },
  vents: { name: '{W} Vents', label: 'Hydrothermal vents', icon: 'springs', color: [255, 170, 120] },
  fossils: { name: '{W} Fossil Beds', label: 'Fossil beds', icon: 'fossil', color: [230, 210, 170] },
  meteorite: { name: '{W} Strewn Field', label: 'Meteorite field', icon: 'meteor', color: [190, 170, 160] },
  hive: { name: '{W} Mounds', label: 'Hive mounds', icon: 'hive', color: [224, 184, 104] },
  wreck: { name: 'Wreck of the {W}', label: 'Derelict vessel', icon: 'wreck', color: [160, 200, 255] },
  tarpit: { name: '{W} Seeps', label: 'Tar seeps', icon: 'springs', color: [150, 110, 70] },
  storm: { name: 'The {W} Storm', label: 'Great storm', icon: 'storm', color: [255, 160, 120] },
};
const SETTLEMENT = ['Village', 'Town', 'City', 'Metropolis', 'Arcology'];

class PlanetSurface {
  constructor(P, W) {
    this.P = P; this.W = W; this.H = W >> 1;
    this.lite = W < 256;
    this.n1 = new Simplex(U.hash(P.seed, 21));
    this.n2 = new Simplex(U.hash(P.seed, 22));
    this.n3 = new Simplex(U.hash(P.seed, 23));
    this.tp = P.terrain;
    this.cSeed = U.hash(P.seed, 24) | 0;
    const g = this.tp.gain;
    this.norm = (1 - Math.pow(g, 7)) / (1 - g);
    this.ready = false; this.progress = 0;
    this.emis = P.type === 'lava' ? [255, 120, 40] : P.type === 'crystal' ? [120, 255, 235] : [255, 198, 112];
    this.rivers = []; this.features = []; this.storms = [];
    this.peakKm = U.clamp(8.8 / Math.pow(Math.max(P.gravity, 0.05), 0.65), 3, 32);
    this.trenchKm = 9;
  }
  octFor(spacingRad) { return U.clamp(Math.floor(Math.log(1 / (2.2 * spacingRad * this.tp.contFreq)) / Math.log(this.tp.lac)) + 2, 3, 15); }

  /* ------------------------------ terrain -------------------------------- */
  height(x, y, z, oct) {
    const T = this.tp, n = this.n1;
    let wx = x, wy = y, wz = z;
    if (T.warp > 0) {
      const f = T.warpFreq;
      wx += T.warp * n.noise3(x * f + 11.3, y * f + 3.1, z * f - 7.7);
      wy += T.warp * n.noise3(x * f - 5.2, y * f + 19.7, z * f + 2.3);
      wz += T.warp * n.noise3(x * f + 8.9, y * f - 13.3, z * f + 17.1);
    }
    let h = 0, amp = 1, f = T.contFreq;
    for (let i = 0; i < oct; i++) {
      h += amp * n.noise3(wx * f + i * 1.7, wy * f - i * 2.3, wz * f + i * 0.9);
      amp *= T.gain; f *= T.lac;
    }
    h /= this.norm;
    if (T.mtn > 0) {
      const mo = Math.max(2, oct - 2);
      let rs = 0, ra = 0.5, rf = T.mtnFreq, prev = 1;
      for (let i = 0; i < mo; i++) {
        let v = 1 - Math.abs(n.noise3(x * rf - 31.1 + i, y * rf + 12.2, z * rf + 5.5 - i));
        v *= v; rs += v * ra * prev; prev = v * 1.6 > 1 ? 1 : v * 1.6; ra *= 0.5; rf *= 2.1;
      }
      h += rs * T.mtn * 0.85 * U.sstep(-0.08, 0.3, h);
    }
    if (T.craters > 0) h += this.craters(x, y, z, oct) * T.craters;
    if (T.volcanoes > 0) h += this.volcanoes(x, y, z) * T.volcanoes;
    if (T.terrace > 0) {
      const t = h * 7, fl = Math.floor(t);
      h += ((fl + U.sstep(0.3, 0.7, t - fl)) / 7 - h) * T.terrace * 0.75;
    }
    if (T.cracks > 0) {
      const c = 1 - Math.abs(this.n2.noise3(x * 5.3, y * 5.3, z * 5.3));
      h -= c * c * c * c * c * c * c * c * 0.05 * T.cracks;
    }
    return h;
  }
  craters(x, y, z, oct) {
    let total = 0;
    const ns = oct > 10 ? 4 : oct > 7 ? 3 : 2;
    const S = [3, 7, 16, 37];
    for (let si = 0; si < ns; si++) {
      const s = S[si], px = x * s, py = y * s, pz = z * s;
      const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
      const seed = this.cSeed + si * 7919;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
        const cx = ix + dx, cy = iy + dy, cz = iz + dz;
        const h = U.h3(cx, cy, cz, seed);
        if ((h & 255) > 110) continue;
        const ox = cx + ((h >>> 8) & 255) / 255 - px, oy = cy + ((h >>> 16) & 255) / 255 - py, oz = cz + ((h >>> 24) & 255) / 255 - pz;
        const rad = 0.16 + (((h >>> 4) & 15) / 15) * 0.3;
        const d2 = ox * ox + oy * oy + oz * oz;
        if (d2 > rad * rad * 4) continue;
        const d = Math.sqrt(d2) / rad;
        const prof = d < 1 ? (d * d - 1) * 0.9 + 0.28 * U.sstep(0.65, 1, d) : 0.28 * Math.exp(-(d - 1) * 4.5);
        total += (prof * rad * 0.8) / s;
      }
    }
    return total;
  }
  volcanoes(x, y, z) {
    const s = 4.2, px = x * s, py = y * s, pz = z * s;
    const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
    let total = 0;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const cx = ix + dx, cy = iy + dy, cz = iz + dz;
      const h = U.h3(cx, cy, cz, this.cSeed ^ 0x5a5a);
      if ((h & 255) > 45) continue;
      const ox = cx + ((h >>> 8) & 255) / 255 - px, oy = cy + ((h >>> 16) & 255) / 255 - py, oz = cz + ((h >>> 24) & 255) / 255 - pz;
      const rad = 0.2 + (((h >>> 4) & 15) / 15) * 0.25;
      const d = Math.sqrt(ox * ox + oy * oy + oz * oz) / rad;
      if (d >= 1) continue;
      let v = Math.pow(1 - d, 1.7) * 0.5;
      if (d < 0.14) v -= (0.14 - d) * 1.4;
      total += (v * rad) / s * 2.2;
    }
    return total;
  }

  /* --------------------------- gas giant colour -------------------------- */
  initGas() {
    const P = this.P, r = new RNG(U.hash(P.seed, 0x6A5));
    const nb = r.int(8, 16);
    let acc = 0;
    this.bandStops = [];
    for (let i = 0; i < nb; i++) { this.bandStops.push({ c: r.pick(P.pal.bands), p: acc }); acc += r.range(0.5, 1.6); }
    this.bandStops.forEach((s) => (s.p /= acc));
    this.bandStops.push({ c: this.bandStops[0].c, p: 1 });
    this.turb = P.type === 'icegiant' ? r.range(0.02, 0.05) : r.range(0.05, 0.12);
    const ns = P.type === 'icegiant' ? r.int(0, 2) : r.int(1, 5);
    this.storms = [];
    for (let i = 0; i < ns; i++) {
      const lat = U.clamp(r.gauss(0, 24), -62, 62), lon = r.range(-180, 180);
      const size = (i === 0 ? r.range(7, 14) : r.range(2.5, 7)) * DEG;
      const cl = Math.cos(lat * DEG);
      this.storms.push({ lat, lon, size, spin: r.sign() * r.range(2, 4), color: C.jitter(P.pal.storm, r, 0.2), v: [cl * Math.sin(lon * DEG), Math.sin(lat * DEG), cl * Math.cos(lon * DEG)] });
    }
  }
  gasColor(x, y, z, oct, o) {
    let px = x, py = y, pz = z, stormT = 0, sc = null;
    for (let i = 0; i < this.storms.length; i++) {
      const s = this.storms[i], v = s.v;
      const dx = px - v[0], dy = py - v[1], dz = pz - v[2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d > s.size * 2.2) continue;
      const k = 1 - d / (s.size * 2.2);
      const ang = s.spin * k * k;
      const c = Math.cos(ang), sn = Math.sin(ang), dot = (px * v[0] + py * v[1] + pz * v[2]) * (1 - c);
      const cx = v[1] * pz - v[2] * py, cy = v[2] * px - v[0] * pz, cz = v[0] * py - v[1] * px;
      px = px * c + cx * sn + v[0] * dot; py = py * c + cy * sn + v[1] * dot; pz = pz * c + cz * sn + v[2] * dot;
      const core = U.sstep(s.size, s.size * 0.25, d);
      if (core > stormT) { stormT = core; sc = s.color; }
    }
    const n = this.n1;
    const tb = n.fbm3(px * 3, py * 11, pz * 3, Math.min(oct, 7)) * this.turb + n.noise3(px * 1.2, py * 2.5, pz * 1.2) * this.turb * 0.8;
    let b = U.clamp((py + tb) * 0.5 + 0.5, 0, 0.99999);
    const st = this.bandStops;
    let i = 0;
    while (i < st.length - 2 && st[i + 1].p <= b) i++;
    const a = st[i], nx = st[i + 1];
    const t = U.sstep(0, 1, (b - a.p) / (nx.p - a.p));
    CC.set(a.c); CC.mix(nx.c, t);
    const streak = this.n2.noise3(px * 2, py * 48, pz * 2);
    CC.mul(0.93 + streak * 0.09);
    if (oct > 7) { const fine = this.n2.fbm3(px * 60, py * 140, pz * 60, oct - 6); CC.mul(0.96 + fine * 0.08); }
    if (sc) { CC.mix(sc, stormT * 0.85); CC.mul(1 - stormT * 0.15 * Math.sin(stormT * 9)); }
    o.r = CC.r; o.g = CC.g; o.b = CC.b; o.e = 0; o.w = 0; o.water = false; o.biome = stormT > 0.3 ? B.STORM : B.BAND;
  }

  /* ------------------------------ shading -------------------------------- */
  shade(h, T, m, lakeV, saltV, x, y, z, fs, o) {
    const P = this.P, pal = P.pal, sea = this.sea;
    const fine = this.n2.noise3(x * fs, y * fs, z * fs);
    let water = h < sea, lake = false;
    if (!water && lakeV + fine * 0.28 > 0.5) { water = true; lake = true; }
    const hN = water ? 0 : U.clamp((h - sea) / this.landSpan, 0, 1);
    const depth = water ? (lake ? 0.05 : U.clamp((sea - h) / this.seaSpan, 0, 1)) : 0;
    o.biome = Biomes.classify(P, T, m, hN, water, depth, lake);
    if (!water && saltV + fine * 0.28 > 0.5 && (P.type === 'terran' || P.type === 'desert' || P.type === 'ocean')) o.biome = B.SALT;
    o.e = 0; o.w = 0; o.water = water;
    switch (P.type) {
      case 'terran': case 'ocean': case 'desert': {
        if (water) {
          CC.set(pal.shallow); CC.mix(pal.deep, lake ? 0.3 : U.sstep(0, 0.45, depth));
          if (P.life >= 1 && depth < 0.1) CC.mix(pal.vegLush, 0.14 * (1 - depth * 10));
          const ice = U.sstep(272, 265, T);
          CC.mix(pal.ice, ice * 0.95);
          o.w = 1 - ice;
        } else {
          CC.set(pal.sand); CC.mix(pal.soil, U.sstep(0.12, 0.5, m)); CC.mix(pal.rock, U.sstep(0.42, 0.8, hN));
          if (hN < 0.02) CC.mix(pal.sand, (1 - hN / 0.02) * 0.55);
          if (P.life >= 2) {
            const va = U.sstep(0.1, 0.5, m) * U.sstep(247, 277, T) * (1 - U.sstep(0.55, 0.85, hN)) * (1 - 0.5 * U.sstep(322, 345, T));
            if (va > 0) {
              const t1 = U.sstep(0.3, 0.8, m), t2 = U.sstep(284, 266, T);
              const d = pal.vegDry, l = pal.vegLush, c = pal.vegCold;
              let vr = d[0] + (l[0] - d[0]) * t1, vg = d[1] + (l[1] - d[1]) * t1, vb = d[2] + (l[2] - d[2]) * t1;
              vr += (c[0] - vr) * t2; vg += (c[1] - vg) * t2; vb += (c[2] - vb) * t2;
              CC.mix3(vr, vg, vb, va * (0.86 + fine * 0.1));
            }
          } else if (P.life === 1) CC.mix(pal.vegLush, 0.16 * U.sstep(0.5, 0.95, m));
          if (o.biome === B.SALT) CC.mix3(234, 228, 216, 0.85);
          CC.mix(pal.snow, U.sstep(270, 262, T));
          CC.mul(0.93 + fine * 0.1);
          if (P.tech >= 1 && T > 255 && T < 318 && hN < 0.6) {
            const c = this.n2.noise3(x * 16 + 40, y * 16, z * 16) * 0.5 + 0.5 + (m > 0.75 ? 0.08 : 0);
            o.e = U.sstep(0.66, 0.9, c) * (0.3 + P.tech * 0.18);
          }
        }
        break;
      }
      case 'frozen': {
        const cr = 1 - Math.abs(this.n2.noise3(x * 5.3, y * 5.3, z * 5.3));
        const crack = Math.pow(cr, 10) * this.tp.cracks;
        if (water && P.biochem === 'ammonia') { CC.set(pal.shallow); CC.mix(pal.deep, U.sstep(0, 0.4, depth)); o.w = 0.8; }
        else if (water) { CC.set(pal.ice); CC.mul(0.93 + depth * 0.05); CC.mix(pal.crack, crack * 0.85); }
        else {
          CC.set(pal.ice); CC.mix(pal.rock, U.sstep(0.35, 0.9, hN) * 0.55); CC.mix(pal.crack, crack * 0.6);
          if (o.biome === B.AMMONIA_FEN) CC.mix(pal.vegLush, 0.55 * U.sstep(0.45, 0.8, m));
        }
        CC.mul(0.95 + fine * 0.07);
        break;
      }
      case 'lava': {
        if (water) {
          const crust = U.sstep(0.1, 0.45, this.n2.noise3(x * 9, y * 9, z * 9) + fine * 0.2);
          CC.set(pal.magma); CC.mix3(255, 214, 120, U.sstep(0.3, 1, fine) * 0.5); CC.mix(pal.crust, crust * 0.85);
          o.e = (1 - crust * 0.85) * (0.75 + fine * 0.25);
        } else {
          CC.set(pal.crust); CC.mix(pal.ash, U.sstep(0.4, 0.8, m)); CC.mix(pal.rock, U.sstep(0.5, 0.9, hN));
          const vein = Math.pow(1 - Math.abs(this.n2.noise3(x * 7 + 3, y * 7, z * 7)), 14);
          CC.mix(pal.magma, vein * 0.9); o.e = vein * 0.85;
          CC.mul(0.9 + fine * 0.15);
        }
        break;
      }
      case 'barren': {
        CC.set(pal.low); CC.mix(pal.dust, U.sstep(0, 0.25, hN)); CC.mix(pal.high, U.sstep(0.3, 0.9, hN));
        if (water) CC.mul(0.78);
        CC.mul(0.9 + fine * 0.14);
        break;
      }
      case 'toxic': {
        if (water) { CC.set(pal.acid); CC.mul(0.75 + (1 - depth) * 0.25); o.w = 0.6; }
        else {
          CC.set(pal.scorch); CC.mix(pal.sulfur, U.sstep(0.4, 0.72, m)); CC.mix(pal.basalt, U.sstep(0.45, 0.8, hN));
          if (P.life >= 2 && o.biome === B.SULFUR) CC.mix(pal.vegLush, 0.45 * U.sstep(0.5, 0.85, m));
          CC.mul(0.9 + fine * 0.14);
        }
        break;
      }
      case 'methane': {

      const band = thick ? 1 : 0.78 + 0.32 * Math.cos(lat * 6);
      for (let i = 0; i < W; i++) {

        const wz = z + cl.warp * n.noise3(x * 1.5 + 9, y * 1.5 * streak, z * 1.5 - 4);
        let v = n.fbm3(wx * f, y * f * streak, wz * f, oct) * 0.5 + 0.5;
        v = v * band;
        const a = U.sstep(1.02 - cl.cover - 0.1, 1.02 - cl.cover + 0.22, v);
        const k = (j * W + i) * 4, sh = 0.82 + 0.18 * U.sstep(0.4, 0.9, v);
        d[k] = cl.color[0] * sh; d[k + 1] = cl.color[1] * sh; d[k + 2] = cl.color[2] * sh; d[k + 3] = a * 255 * (thick ? 0.97 : 0.92);

  }

  /* ------------------------------ features ------------------------------- */
  makeFeature(type, lat, lon, seed) {

    const f = { type, lat, lon, seed, icon: ft.icon, color: ft.color, label: ft.label, name: ft.name.replace('{W}', w) };
    if (type === 'city') { f.label = SETTLEMENT[Math.max(0, this.P.tech)]; f.pop = Math.pow(10, 3 + this.P.tech * 0.9 + r.float() * 1.5); }

  }
  locInfo(lat, lon) {
    const c = this.climateLL(lat, lon), cl = Math.cos(lat * DEG);
    const x = cl * Math.sin(lon * DEG), y = Math.sin(lat * DEG), z = cl * Math.cos(lon * DEG);
    const h = this.height(x, y, z, this.oct || 7);

    const hN = (h - this.sea) / this.landSpan;

  }
  /** Tile-independent vegetation estimate from the climate grid (used for glyph placement). */
  vegAt(lat, lon) {

    const x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;

    const h = (g[ya + xa] * (1 - fx) + g[ya + xb] * fx) * (1 - fy) + (g[yb + xa] * (1 - fx) + g[yb + xb] * fx) * fy;

    const biome = Biomes.classify(this.P, c.T, c.m, hN, water, water ? U.clamp((this.sea - h) / this.seaSpan, 0, 1) : 0, c.lake > 0.5);

  elevation(h) { return h >= this.sea ? ((h - this.sea) / this.landSpan) * this.peakKm * 1000 : -((this.sea - h) / this.seaSpan) * this.trenchKm * 1000; }

    const cands = (L) => {
      const c = [], T = L.T, bi = L.biome;
      if (L.water) {

        if (P.activity > 0.45 && P.type !== 'lava') c.push(['vents', 0.6]);
      } else {

        if (P.type === 'lava') c.push(['lavalake', 3]);

        c.push(['spires', P.type === 'crystal' ? 5 : 0.06]);
        if (P.type === 'frozen' || T < 250) c.push(['icespire', 1.4]);
        if (P.life >= 3 && BIOMES[bi].veg > 0.6) c.push(['tree', 1.6]);
        if (P.life >= 2 || P.ruins) c.push(['fossils', 0.7]);
        if (P.type === 'barren' || P.isMoon) c.push(['meteorite', 1.4]);
        if (P.life >= 3) c.push(['hive', 0.8]);
        if (P.ruins) c.push(['ruins', 3]);
        if (P.type === 'carbon' || P.type === 'methane') c.push(['tarpit', 1.5]);

    for (let cj = 0; cj < 180 / cell; cj++) for (let ci = 0; ci < 360 / cell; ci++) {
      const r = new RNG(U.hash(P.seed, ci, cj, 0xFEA7));
      const latC = 90 - (cj + 0.5) * cell;
      if (Math.abs(latC) > 78 || !r.chance(0.026 * Math.cos(latC * DEG) + 0.004)) continue;
      const lat = 90 - (cj + r.float()) * cell, lon = -180 + (ci + r.float()) * cell;
      const L = this.locInfo(lat, lon);

      if ((type === 'monolith' || type === 'wreck') && seen.has(type)) continue;

      const cc = 3;
      for (let cj = 0; cj < 180 / cc; cj++) for (let ci = 0; ci < 360 / cc; ci++) {

  /* ---------------------------- surface tiles ---------------------------- */
  /** Render a tile covering [lon0, lon0+span] × [lat1-span, lat1] with S×S samples plus a

  tile(lon0, lat1, span, S, lod, out) {

        const k = (jj + 1) * N + (ii + 1);
        const x = xs[k], y = ys[k], z = zs[k];

        const inner = ii > 0 && jj > 0 && ii <= S && jj <= S, o = inner ? (jj - 1) * S + (ii - 1) : -1;
        if (this.gas) {
          this.gasColor(x, y, z, oct + 2, SH);
          d[p] = SH.r; d[p + 1] = SH.g; d[p + 2] = SH.b; d[p + 3] = 255;
          if (inner) bio[o] = SH.biome;

        }
        const lat = Math.asin(y) / DEG, lon = Math.atan2(x, z) / DEG;
        const c = this.climateLL(lat, lon);
        const h = hs[k];
        const jit = this.n2.noise3(x * 90, y * 90, z * 90) * 0.06;
        this.shade(h, c.T, c.m + jit, c.lake + jit * 2, c.salt, x, y, z, fs, SH);
        let r = SH.r, g = SH.g, b = SH.b;

            const dd = Math.cos(x * f + y * f * 0.37 + this.n2.noise3(x * 60, y * 60, z * 60) * 3) * duneAmp * 0.9;
            dzdx += dd; dzdy += dd * 0.4;
          }

          const sh = U.clamp(0.42 + (-dzdx * lx - dzdy * ly + lz) * inv * 0.82, 0.25, 1.35);
          r *= sh; g *= sh; b *= sh;
          if (inner) veg[o] = P.life >= 2 ? BIOMES[SH.biome].veg * U.sstep(0.1, 0.5, c.m) : 0;

/* ------------------------------ surface registry ------------------------- */
const Surfaces = {
  full: new LRU(3, (s) => { if (typeof Globe !== 'undefined') Globe.release(s); }),
  thumbs: new LRU(220, (s) => { if (typeof Globe !== 'undefined') Globe.release(s); }),
  thumbW: 128,
  getThumb(P) {

  thumbNow(P) {

  getFull(P, W) {

/* Web-worker builder: surveys run off the main thread so the UI stays fluid.
   The worker is created from this very script's source (no external files);

const WORKER_MAIN = `
self.onmessage = function (e) {
  var d = e.data;
  try {
    var s = new PlanetSurface(d.P, d.W), it = s.build(), r, last = 0;
    do { r = it.next(); if (typeof r.value === 'number' && r.value - last > 0.025) { last = r.value; self.postMessage({ id: d.id, progress: r.value }); } } while (!r.done);

  },
  d_lithoform(ctx, ph, a) {
    const r = new RNG(ph.patSeed), R = 22 * ph.girth, cy = 40 - R * 0.6 - 10 * ph.legLen;
    const legs = ph.legPairs;
    for (let i = 0; i < legs * 2; i++) {

  d_microbe(ctx, ph, a) {

  portrait(sp, w = 160, h = 120) {

  sheet(sp) {

  },
};

/* ============================== RENDER ===================================
   WebGL is used for the big planet globe (texture + bump + specular + clouds
   + atmosphere) and animated star surfaces. A software globe renderer draws
   thumbnails and serves as fallback when WebGL is unavailable.

const GLSL_HEAD = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

const GL_VS = `attribute vec2 aPos; uniform float uExt; varying vec2 vP;
void main(){ vP = aPos * uExt; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const GLOBE_FS = GLSL_HEAD + `
varying vec2 vP;
uniform sampler2D uColor, uData, uCloud;

uniform vec3 uLight, uAtmo, uEmisCol;
uniform vec2 uTexel;

    float hR = texture2D(uData, uv + vec2(uTexel.x, 0.0)).r;

void main(){

  col += mix(uColor, vec3(1.0), 0.65) * pow(z, 3.0) * 0.4;
  float edge = clamp((1.0 - r) / uPix, 0.0, 1.0);

const GL = {
  ok: false, size: 1024, ctxId: 0,
  init() {
    try {

  texture(src, W, H, data) {

  blit(ctx, px, x, y, w, h, comp) {

const Globe = {
  upload(S) {
    if (!GL.ok || !S.ready) return null;

const StarRender = {
  draw(ctx, star, cx, cy, r, t, o = {}) {
    const col = star.color;
    if (star.cls === 'BH') return StarRender.blackHole(ctx, star, cx, cy, r, t);
    const glowR = r * (star.cls === 'NS' ? 14 : star.cls === 'WD' ? 7 : 4.2);
    const g = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, glowR);
    g.addColorStop(0, C.css(col, 0.5)); g.addColorStop(0.25, C.css(col, 0.16)); g.addColorStop(1, C.css(col, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (star.cls === 'NS') StarRender.pulsarBeams(ctx, star, cx, cy, r, t);
    if (GL.ok && r > 3) {
      const ext = 2.6, px = Math.min(GL.size, Math.max(8, Math.ceil(2 * r * ext * App.dpr)));
      const gl = GL.gl, pr = GL.star;

      GL.blit(ctx, px, cx - r * ext, cy - r * ext, 2 * r * ext, 2 * r * ext, 'lighter');
    } else {

      d.addColorStop(0, '#fff'); d.addColorStop(0.4, C.css(C.mix(col, [255, 255, 255], 0.5))); d.addColorStop(1, C.css(col));
      ctx.fillStyle = d; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    }
  },
  pulsarBeams(ctx, star, cx, cy, r, t) {

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.globalCompositeOperation = 'lighter';
    for (const s of [1, -1]) {

    }
    ctx.restore();
  },
  blackHole(ctx, star, cx, cy, r, t) {

      ctx.save(); ctx.beginPath(); ctx.rect(cx - R * 5, cy + y0, R * 10, y1 - y0); ctx.clip();

        ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * 0.22, -0.12, 0, TAU); ctx.stroke();
      }
      for (let k = 0; k < 8; k++) {
        const a = spin * (1.4 - k * 0.08) + k * 0.8, rr = R * (1.7 + (k % 4) * 0.6);

        ctx.fillStyle = 'rgba(255,240,210,0.7)'; ctx.beginPath(); ctx.arc(x, y, R * 0.12, 0, TAU); ctx.fill();
      }
      ctx.restore();
    };
    disk(-R * 5, 0);
    ctx.strokeStyle = 'rgba(255,200,140,0.55)'; ctx.lineWidth = R * 0.28;
    ctx.beginPath(); ctx.ellipse(cx, cy - R * 0.1, R * 1.35, R * 1.25, 0, Math.PI, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,230,190,0.9)'; ctx.lineWidth = Math.max(1, R * 0.07);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.04, 0, TAU); ctx.stroke();
    disk(0, R * 5);
    ctx.restore();
  },
};

/* --------------------------- software globe ------------------------------ */
const SoftGlobe = {
  luts: new Map(),
  lut(S, tilt) {
    const key = S + ':' + tilt.toFixed(3);
    let L = this.luts.get(key);
    if (L) return L;
    const idx = [], u = [], v = [], nx = [], ny = [], nz = [], cov = [];
    const c = Math.cos(tilt), s = Math.sin(tilt);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const px = ((x + 0.5) / S) * 2 - 1, py = 1 - ((y + 0.5) / S) * 2, r2 = px * px + py * py;
      if (r2 > 1.0 + 2.5 / S) continue;
      const rr = Math.min(0.99999, Math.sqrt(r2)), z = Math.sqrt(1 - rr * rr);
      const k = rr > 0 ? rr / Math.sqrt(r2) : 1;
      const X = px * k, Y = py * k;
      const oy = Y * c - z * s, oz = Y * s + z * c;
      idx.push(y * S + x); u.push(Math.atan2(X, oz) / TAU + 0.5); v.push(0.5 - Math.asin(U.clamp(oy, -1, 1)) / Math.PI);
      nx.push(X); ny.push(Y); nz.push(z); cov.push(U.clamp((1 - Math.sqrt(r2)) * S * 0.5 + 0.5, 0, 1));
    }
    L = { n: idx.length, idx: Int32Array.from(idx), u: Float32Array.from(u), v: Float32Array.from(v), nx: Float32Array.from(nx), ny: Float32Array.from(ny), nz: Float32Array.from(nz), cov: Float32Array.from(cov) };
    this.luts.set(key, L);
    return L;
  },
  /** Render a globe into a square canvas of size S. light is [x,y,z] in view space. */
  render(canvas, S, surf, rot, tilt, light, cloudRot, smooth) {
    if (canvas.width !== S) { canvas.width = S; canvas.height = S; canvas._img = null; }
    const ctx = canvas.getContext('2d');
    const img = canvas._img || (canvas._img = ctx.createImageData(S, S));
    const d = img.data;
    d.fill(0);
    const L = this.lut(S, tilt || 0), tex = surf.colorData, W = surf.W, H = surf.H;
    const cl = surf.cloudData, CW = surf.cloudW, CH = surf.cloudH;
    const du = rot / TAU, dcu = (cloudRot == null ? rot : cloudRot) / TAU;
    const lx = light[0], ly = light[1], lz = light[2];
    const atmo = surf.P.atmo, ar = atmo.color[0], ag = atmo.color[1], ab = atmo.color[2], as = atmo.strength;
    for (let i = 0; i < L.n; i++) {
      let uu = L.u[i] + du; uu -= Math.floor(uu);
      const nd = L.nx[i] * lx + L.ny[i] * ly + L.nz[i] * lz;
      const lit = nd > 0 ? 0.03 + nd * 1.05 : 0.03 * U.clamp(1 + nd * 4, 0, 1);
      let r, g, b;
      if (smooth) {
        const fx = uu * W - 0.5, fy = U.clamp(L.v[i] * H - 0.5, 0, H - 1.001), x0 = Math.floor(fx), y0 = Math.floor(fy), ax = fx - x0, ay = fy - y0;
        const xa = ((x0 % W) + W) % W, xb = (xa + 1) % W, ya = y0 * W, yb = Math.min(H - 1, y0 + 1) * W;
        const p00 = (ya + xa) * 4, p10 = (ya + xb) * 4, p01 = (yb + xa) * 4, p11 = (yb + xb) * 4;
        const w00 = (1 - ax) * (1 - ay), w10 = ax * (1 - ay), w01 = (1 - ax) * ay, w11 = ax * ay;
        r = (tex[p00] * w00 + tex[p10] * w10 + tex[p01] * w01 + tex[p11] * w11) * lit;
        g = (tex[p00 + 1] * w00 + tex[p10 + 1] * w10 + tex[p01 + 1] * w01 + tex[p11 + 1] * w11) * lit;
        b = (tex[p00 + 2] * w00 + tex[p10 + 2] * w10 + tex[p01 + 2] * w01 + tex[p11 + 2] * w11) * lit;
      } else {
        const t = (Math.min(H - 1, (L.v[i] * H) | 0) * W + ((uu * W) | 0)) * 4;
        r = tex[t] * lit; g = tex[t + 1] * lit; b = tex[t + 2] * lit;
      }
      if (cl) {
        let cu = L.u[i] + dcu; cu -= Math.floor(cu);
        const ct = ((Math.min(CH - 1, (L.v[i] * CH) | 0)) * CW + ((cu * CW) | 0)) * 4, ca = cl[ct + 3] / 255;
        const cli = nd > 0 ? 0.04 + nd : 0.04;
        r += (cl[ct] * cli - r) * ca; g += (cl[ct + 1] * cli - g) * ca; b += (cl[ct + 2] * cli - b) * ca;
      }
      if (as > 0) { const f = Math.pow(1 - L.nz[i], 2.5) * as * (nd > -0.2 ? 0.1 + Math.max(0, nd + 0.2) : 0.05); r += ar * f; g += ag * f; b += ab * f; }
      const o = L.idx[i] * 4;
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = L.cov[i] * 255;
    }
    ctx.putImageData(img, 0, 0);
  },
  drawDirect(ctx, S, cx, cy, r, o) {
    const size = U.clamp(Math.round(r * 2 * Math.min(App.dpr, 1.25)), 16, 420);
    const c = this._c || (this._c = document.createElement('canvas'));
    SoftGlobe.render(c, size, S, o.rot, o.tilt || 0, o.light, o.cloudRot, size > 96);
    ctx.drawImage(c, cx - r, cy - r, r * 2, r * 2);
    const atmo = S.P.atmo;
    if (atmo.strength > 0) {
      const g = ctx.createRadialGradient(cx, cy, r * 0.98, cx, cy, r * 1.18);
      g.addColorStop(0, C.css(atmo.color, atmo.strength * 0.5)); g.addColorStop(1, C.css(atmo.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 1.18, 0, TAU); ctx.fill();
    }
  },
};

/* ------------------------------ planet sprites --------------------------- */
const Sprites = {
  /** A per-body thumbnail globe canvas, re-rendered periodically. */
  body(P, sizePx, rot, light, frame) {
    const S = U.clamp(Math.pow(2, Math.ceil(Math.log2(Math.max(8, sizePx * 2 * Math.min(App.dpr, 1.5))))), 16, 128);
    const surf = Surfaces.getThumb(P);
    if (!surf) return null;
    const c = P._spr || (P._spr = document.createElement('canvas'));
    const lk = light[0].toFixed(2) + light[1].toFixed(2) + light[2].toFixed(2);
    if (c.width !== S || c._lk !== lk || frame - (c._f || -99) > 6 || c._surf !== surf) {
      SoftGlobe.render(c, S, surf, rot, 0, light, rot * 1.3);
      c._lk = lk; c._f = frame; c._surf = surf;
    }
    return c;
  },
  glowCache: new Map(),
  glow(col) {
    const key = col.map((v) => v | 0).join(',');
    let c = this.glowCache.get(key);
    if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.12, C.css(C.mix(col, [255, 255, 255], 0.55), 0.95));
    g.addColorStop(0.3, C.css(col, 0.35)); g.addColorStop(1, C.css(col, 0));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    this.glowCache.set(key, c);
    return c;
  },
};

/* ------------------------------ ring images ------------------------------ */
const Rings = {
  cache: new LRU(12),
  image(P) {
    let c = this.cache.get(P.seed);
    if (c) return c;
    const R = P.rings, S = 512, r = new RNG(R.seed);
    c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    const prof = [];
    for (let i = 0; i < 128; i++) prof.push(r.float());
    const gaps = [r.range(0.2, 0.8), r.range(0.2, 0.8)];
    const rin = (R.inner / R.outer) * (S / 2), rout = S / 2;
    for (let i = 0; i < 180; i++) {
      const t = i / 179, rad = rin + (rout - rin) * t;
      let a = (0.35 + 0.65 * prof[(t * 127) | 0]) * U.sstep(0, 0.06, t) * U.sstep(1, 0.9, t) * R.opacity;
      for (const gp of gaps) if (Math.abs(t - gp) < 0.018) a *= 0.08;
      const col = C.mix(R.c1, R.c2, 0.5 + 0.5 * Math.sin(t * 17 + prof[3] * 6));
      x.strokeStyle = C.css(col, a); x.lineWidth = ((rout - rin) / 179) * 1.6;
      x.beginPath(); x.arc(S / 2, S / 2, rad, 0, TAU); x.stroke();
    }
    return this.cache.set(P.seed, c);
  },
  /** Draw half the ring (back = far side, above the planet centre). */
  draw(ctx, P, cx, cy, pr, tilt, back) {
    const img = Rings.image(P), R = pr * P.rings.outer, k = Math.max(0.12, Math.abs(Math.sin(tilt)));
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(P.rings.tilt);
    ctx.beginPath();
    if (back) ctx.rect(-R - 2, -R - 2, 2 * R + 4, R + 2); else ctx.rect(-R - 2, 0, 2 * R + 4, R + 2);
    ctx.clip();
    ctx.drawImage(img, -R, -R * k, 2 * R, 2 * R * k);
    ctx.restore();
  },
};

/* ----------------------------- background stars -------------------------- */
const Starfield = {
  layers: null,
  init() {
    this.layers = [0, 1, 2].map((L) => {
      const S = 512, c = document.createElement('canvas');
      c.width = c.height = S;
      const x = c.getContext('2d'), r = new RNG(0xBEEF + L);
      const n = [520, 170, 45][L];
      for (let i = 0; i < n; i++) {
        const px = r.float() * S, py = r.float() * S, b = r.range(0.25, 1) * [0.55, 0.8, 1][L];
        const col = r.pick([[255, 255, 255], [200, 220, 255], [255, 230, 200], [255, 210, 180], [180, 200, 255]]);
        const sz = [0.7, 1.1, 1.6][L] * r.range(0.7, 1.3);
        x.fillStyle = C.css(col, b);
        x.beginPath(); x.arc(px, py, sz, 0, TAU); x.fill();
        if (L === 2) { const g = x.createRadialGradient(px, py, 0, px, py, sz * 4); g.addColorStop(0, C.css(col, 0.3)); g.addColorStop(1, C.css(col, 0)); x.fillStyle = g; x.fillRect(px - sz * 4, py - sz * 4, sz * 8, sz * 8); }
      }

  draw(ctx, W, H, ox, oy, alpha = 1) {

    });

};

/* ------------------------------ feature icons ---------------------------- */

      case 'geyser': case 'springs':

class PlanetView extends View {
  constructor() { super(); this.name = 'planet'; }

  }
  exit() { UI.progress.hide(); }
  crumbs() {
    const c = [{ label: Galaxy.name, sub: 'Universe', act: () => App.navigate(Codes.galaxy(Galaxy.name, this.sys.gx || 0, this.sys.gy || 0), { select: this.sys.code }) }, { label: this.sys.name, dot: this.sys.star.color, act: () => App.navigate(this.sys.code) }];
    if (this.parent) c.push({ label: this.parent.name, dot: this.parent.color, act: () => App.navigate(World.bodyCode(this.sys, this.parent)) });

  }
  get S() { return this.surf.ready ? this.surf : this.thumb; }
  geom() { const v = App.vp; return { cx: v.cx, cy: v.cy, R: Math.min(v.w, v.h) * 0.33 * this.zoom }; }

    };
  },

        const j = JSON.parse(raw);
        for (const k of Object.keys(d)) if (j[k] !== undefined) d[k] = typeof d[k] === 'object' && !Array.isArray(d[k]) && d[k] ? Object.assign(d[k], j[k]) : j[k];
      }

    } catch (e) { this.ok = false; }

  },
  save(now) {
    clearTimeout(this._t);

    const keys = Object.keys(d.visited);

    this.save();
  },
  observe(sys, P, code) {

    if (P.life) {

      for (const sp of eco.species) if (!d.codex[sp.code]) { d.codex[sp.code] = { n: sp.common, s: sp.sci, f: sp.family, p: P.name, pc: code, t: Date.now() }; fresh++; }

    }

  },

    if (i >= 0) { this.data.bookmarks.splice(i, 1); UI.toast('Removed from discoveries'); }
    else { this.data.bookmarks.unshift({ id: U.hex(U.hstr(b.code + Date.now())), code: b.code, name: b.name, kind: b.kind, note: '', t: Date.now() }); UI.toast(`Saved “${b.name}” to discoveries`, 'good'); }

    if (j.codex && typeof j.codex === 'object') for (const [k, v] of Object.entries(j.codex)) if (!d.codex[k] && v && typeof v === 'object') { d.codex[k] = { n: String(v.n || ''), s: String(v.s || ''), f: String(v.f || ''), p: String(v.p || ''), pc: String(v.pc || ''), t: +v.t || Date.now() }; nc++; }

/* ============================== SEARCH =================================== */
const CRITERIA = [
  { id: 'life', label: 'Any life', t: (P) => P.life >= 1 },
  { id: 'complex', label: 'Complex life', t: (P) => P.life >= 3 },
  { id: 'sapient', label: 'Sapient', t: (P) => P.life >= 4 },
  { id: 'ruins', label: 'Ancient ruins', t: (P) => P.ruins },
  { id: 'earthlike', label: 'Earth-like', t: (P) => P.esi >= 0.78 },
  { id: 'terran', label: 'Terrestrial', t: (P) => P.type === 'terran' },
  { id: 'ocean', label: 'Ocean', t: (P) => P.type === 'ocean' },
  { id: 'desert', label: 'Desert', t: (P) => P.type === 'desert' },
  { id: 'frozen', label: 'Frozen', t: (P) => P.type === 'frozen' },
  { id: 'lava', label: 'Volcanic', t: (P) => P.type === 'lava' },
  { id: 'toxic', label: 'Toxic', t: (P) => P.type === 'toxic' },
  { id: 'methane', label: 'Hydrocarbon', t: (P) => P.type === 'methane' },
  { id: 'crystal', label: 'Crystalline', t: (P) => P.type === 'crystal' },
  { id: 'carbon', label: 'Carbon', t: (P) => P.type === 'carbon' },
  { id: 'gas', label: 'Gas giant', t: (P) => P.type === 'gasgiant' },
  { id: 'ice', label: 'Ice giant', t: (P) => P.type === 'icegiant' },
  { id: 'rings', label: 'Ringed', t: (P) => !!P.rings },
  { id: 'moon', label: 'Is a moon', t: (P) => P.isMoon },
  { id: 'locked', label: 'Tidally locked', t: (P) => P.locked && !P.isMoon },
  { id: 'binary', label: 'Binary star', sys: true, t: (s) => !!s.companion },
  { id: 'bh', label: 'Black hole', sys: true, t: (s) => s.star.cls === 'BH' },
  { id: 'pulsar', label: 'Pulsar', sys: true, t: (s) => s.star.cls === 'NS' },
  { id: 'giantstar', label: 'Giant star', sys: true, t: (s) => s.star.cls === 'RG' || s.star.cls === 'BSG' },
  { id: 'reddwarf', label: 'Red dwarf', sys: true, t: (s) => s.star.cls === 'M' },
];
const Search = {
  run(q, onResult, onProgress, onDone) {
    Scheduler.cancel('search');
    const S = Galaxy.SECTOR, base = Search.origin();
    const csx = Math.floor(base.x / S), csy = Math.floor(base.y / S);
    const R = q.radius || 12, max = q.max || 60;
    const crit = CRITERIA.filter((c) => q.crit.includes(c.id));
    const sysC = crit.filter((c) => c.sys), bodyC = crit.filter((c) => !c.sys);
    const name = (q.name || '').trim().toLowerCase();
    let found = 0;
    const gen = (function* () {
      for (let r = 0; r <= R; r++) {
        const cells = [];
        if (r === 0) cells.push([0, 0]);
        else for (let i = -r; i < r; i++) cells.push([i, -r], [r, i], [-i, r], [-r, -i]);
        for (const [dx, dy] of cells) {
          const sec = Galaxy.sector(csx + dx, csy + dy);
          for (const st of sec.stars) {
            if (sysC.length && !sysC.every((c) => c.t({ star: st.star, companion: null }) || c.id === 'binary')) continue;
            const sys = World.cache.peek(st.code) || SystemGen.generate(st.seed, { code: st.code, x: st.x, y: st.y });
            if (!sysC.every((c) => c.t(sys))) continue;
            const bodies = [];
            sys.planets.forEach((P) => { bodies.push(P); P.moons.forEach((M) => bodies.push(M)); });
            for (const P of bodies) {
              if (!bodyC.every((c) => c.t(P))) continue;
              if (q.res && !P.resources.some((x) => x.id === q.res && x.a >= 0.55)) continue;
              if (name && !P.name.toLowerCase().includes(name) && !sys.name.toLowerCase().includes(name)) continue;
              const nm = P.name || '';
              onResult({ code: World.bodyCode(sys, P), P, sys, dist: Math.hypot(st.x - base.x, st.y - base.y), name: nm });
              if (++found >= max) return;
              if (!bodyC.length && !q.res && !name) break;
            }
          }
        }
        yield r / R;
      }
    })();
    Scheduler.add('search', gen, { priority: 3, onProgress, onDone: () => onDone(found) });
  },
  origin() {
    const v = App.view;
    if (v && v.sys && v.sys.gx != null) return { x: v.sys.gx, y: v.sys.gy };
    return { x: App.views.galaxy.cam.x, y: App.views.galaxy.cam.y };
  },
  surprise() {
    const x = (Math.random() - 0.5) * 400000, y = (Math.random() - 0.5) * 400000;
    UI.toast('Scanning a random region for complex life…');
    App.views.galaxy.cam.x = x; App.views.galaxy.cam.y = y;
    let done = false;
    Search.run({ crit: ['complex'], radius: 30, max: 1 }, (r) => { if (!done) { done = true; App.navigate(r.code); } }, null, (n) => { if (!n) UI.toast('Nothing found — the void is vast. Try again.', 'warn'); });
  },
};

    const layers = P.giant ? ['terrain'] : ['terrain', 'elevation', 'climate', 'biomes'];
    const L = v.mapLayer || 'terrain';
    return `${locHtml}
      <div class="sec">Survey map</div>
      ${layers.length > 1 ? `<div class="seg">${layers.map((l) => `<button class="${l === L ? 'on' : ''}" data-act="layer" data-arg="${l}">${l[0].toUpperCase() + l.slice(1)}</button>`).join('')}</div>` : ''}
      <div class="map-wrap"><canvas id="surveyMap"></canvas></div>
      <div class="sec">${P.giant ? 'Cloud layers' : 'Biome distribution'}</div>
      <div class="stack">${stats.map((b) => `<b style="width:${(b.a * 100).toFixed(2)}%;background:${C.css(BIOMES[b.id].color)}" title="${Biomes.name(b.id, P)}"></b>`).join('')}</div>
      <div class="legend">${stats.slice(0, 10).map((b) => `<span><i style="background:${C.css(BIOMES[b.id].color)}"></i>${Biomes.name(b.id, P)} ${F.pct(b.a, b.a < 0.1 ? 1 : 0)}</span>`).join('')}</div>
      ${S.ready ? `<div class="sec">Notable features · ${S.features.length}</div>
      <div class="list">${S.features.slice(0, 14).map((f, i) => `<div class="li" data-act="feature" data-arg="${i}"><span class="lifedot" style="background:${C.css(f.color)}"></span><div class="t"><b>${F.esc(f.name)}</b><small>${f.label} · ${F.lat(f.lat)} ${F.lon(f.lon)}</small></div><div class="r">${UI.icons.descend.replace('<svg', '<svg width="16" height="16"')}</div></div>`).join('') || '<div class="empty">No major landmarks surveyed.</div>'}</div>
      ${S.rivers.length ? `<p class="muted" style="font-size:12px;margin-top:10px">${F.i(S.rivers.length)} river systems traced by flow accumulation.</p>` : ''}` : '<div class="note" style="margin-top:12px">Detailed survey in progress…</div>'}`;
  },
  mountMap(el, v) {
    const c = el.querySelector('#surveyMap');
    if (!c) return;
    const S = v.surf.ready ? v.surf : v.thumb, P = v.P;
    const w = c.parentElement.clientWidth || 340, h = Math.round(w / 2), dpr = Math.min(2, App.dpr);
    c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
    const x = c.getContext('2d');
    const L = v.mapLayer || 'terrain';
    if (L === 'terrain' || !S.gridH) x.drawImage(S.canvas, 0, 0, c.width, c.height);
    else {
      const CW = S.CW, CH = S.CH, img = x.createImageData(CW, CH), d = img.data;
      for (let k = 0; k < CW * CH; k++) {
        let col;
        if (L === 'elevation') { const hh = S.gridH[k]; col = hh < S.sea ? C.mix([10, 20, 70], [60, 140, 220], U.clamp((hh - S.hmin) / S.seaSpan, 0, 1)) : C.mix(C.mix([60, 140, 70], [170, 130, 80], U.clamp((hh - S.sea) / S.landSpan * 2, 0, 1)), [250, 250, 250], U.clamp((hh - S.sea) / S.landSpan * 2 - 1, 0, 1)); }
        else if (L === 'climate') { const T = S.temp[k]; col = C.hsl(U.clamp(240 - (T - 180) * 1.3, 0, 260), 0.75, 0.5); if (S.gridWater[k]) col = C.scale(col, 0.6); }
        else col = BIOMES[S.biome[k]].color;
        d[k * 4] = col[0]; d[k * 4 + 1] = col[1]; d[k * 4 + 2] = col[2]; d[k * 4 + 3] = 255;
      }
      const t = document.createElement('canvas'); t.width = CW; t.height = CH; t.getContext('2d').putImageData(img, 0, 0);
      x.imageSmoothingEnabled = true; x.drawImage(t, 0, 0, c.width, c.height);
    }
    if (v.surf.ready) for (const f of v.surf.features) { x.fillStyle = C.css(f.color); x.beginPath(); x.arc(((f.lon + 180) / 360) * c.width, ((90 - f.lat) / 180) * c.height, 2 * dpr, 0, TAU); x.fill(); }
    if (v.loc) { const px = ((v.loc.lon + 180) / 360) * c.width, py = ((90 - v.loc.lat) / 180) * c.height; x.strokeStyle = '#5ee7ff'; x.lineWidth = 2 * dpr; x.beginPath(); x.arc(px, py, 6 * dpr, 0, TAU); x.stroke(); x.beginPath(); x.moveTo(px, 0); x.lineTo(px, c.height); x.moveTo(0, py); x.lineTo(c.width, py); x.strokeStyle = 'rgba(94,231,255,0.35)'; x.lineWidth = dpr; x.stroke(); }
    c.onclick = (e) => {
      const r = c.getBoundingClientRect(), lon = ((e.clientX - r.left) / r.width) * 360 - 180, lat = 90 - ((e.clientY - r.top) / r.height) * 180;
      v.loc = { lat: U.clamp(lat, -80, 80), lon };
      v.camOff += 0; UI.panel.body(false);
    };
  },
  genesisPlanet(v) {
    const P = v.P, S = v.surf, T = P.terrain, loc = Codes.parse(v.bodyCode);
    return `<p class="desc">This world is regenerated from its seed every time you arrive. Terrain is sampled from seeded 3D Simplex noise on the unit sphere, so the globe, the survey map and the surface tiles all read the same underlying field.</p>
      <div class="sec">Seed chain</div>
      <div class="kv">
        <span>System</span><span>${F.esc(loc.sys)} → ${U.hex(v.sys.seed)}</span>
        <span>Body seed</span><span>${U.hex(P.seed)}</span>
        <span>Terrain noise</span><span>Simplex(hash(seed,21))</span>
        <span>Climate noise</span><span>Simplex(hash(seed,22))</span>
        <span>Cloud noise</span><span>Simplex(hash(seed,23))</span>
        <span>Life seed</span><span>${U.hex(P.lifeSeed)}</span>
      </div>
      <div class="sec">Terrain field</div>
      <div class="kv">
        <span>Continental freq.</span><span>${F.n(T.contFreq, 3)}</span><span>Octaves (globe)</span><span>${S.ready ? S.oct : '…'} + up to 15 on surface</span>
        <span>Lacunarity · gain</span><span>${F.n(T.lac, 3)} · ${F.n(T.gain, 3)}</span><span>Domain warp</span><span>${F.n(T.warp, 3)} @ ${F.n(T.warpFreq, 2)}</span>
        <span>Ridged mountains</span><span>${F.n(T.mtn, 3)} @ ${F.n(T.mtnFreq, 2)}</span><span>Craters · volcanoes</span><span>${F.n(T.craters, 2)} · ${F.n(T.volcanoes, 2)}</span>
        <span>Terraces · dunes · fractures</span><span>${F.n(T.terrace, 2)} · ${F.n(T.dunes, 2)} · ${F.n(T.cracks, 2)}</span>
      </div>
      <div class="sec">Climate & hydrology</div>
      <div class="kv">
        <span>Liquid fraction</span><span>${F.pct(P.liquid, 1)} (area-weighted quantile)</span>
        <span>Sea level</span><span>${S.ready && !S.gas ? F.n(S.sea, 4) : '—'}</span>
        <span>Equator–pole ΔT</span><span>${F.n(P.dT, 1)} K</span><span>Lapse rate</span><span>${F.n(P.lapse, 1)} K / relief</span>
        <span>Rivers</span><span>${S.ready ? S.rivers.length + ' (priority-flood + D8 accumulation)' : '…'}</span>
        <span>Texture</span><span>${S.W}×${S.H} · climate grid ${S.W >> 1}×${S.H >> 1}</span>
        <span>Build time</span><span>${S.ready ? F.i(S.buildMs) + ' ms (time-sliced)' : 'in progress'}</span>
        <span>Heightfield checksum</span><span id="cksum">${S.ready ? U.hex(S.checksum) : '…'}</span>
      </div>
      <div class="btns"><button class="btn grow" data-act="verify">${UI.icons.enter} Verify determinism</button></div>`;
  },

  /* ------------------------------ life tab -------------------------------- */
  lifeTab(P, eco, code) {

    const ev = Life.recentEvents(eco, App.t, 6);
    return `<div class="stats">
        ${UI.h.stat('Biosphere', `<span style="color:${UI.lifeColor(P.life)}">${LIFE_LEVELS[P.life]}</span>`)}
        ${UI.h.stat('Biochemistry', BIOCHEM[P.biochem].name)}
        ${UI.h.stat('Species', `${eco.species.length} <small>in ${eco.clades.length} clades</small>`)}
        ${UI.h.stat('Habitats', eco.habitats.map((h) => (P.biochem === 'subglacial' && h === 'water' ? 'subglacial' : h)).join(' · '))}
        ${P.tech >= 0 ? UI.h.stat('Civilization', `${F.esc(P.civName)} <small>${TECH_LEVELS[P.tech]}</small>`, true) : ''}
      </div>
      <p class="desc" style="margin-top:10px">${BIOCHEM[P.biochem].note}</p>
      <div class="sec">Species</div>
      <div class="cards">${eco.species.map((sp) => `<div class="card" data-act="species" data-arg="${sp.code}"><canvas data-portrait="${sp.idx}" width="300" height="225"></canvas><b>${F.esc(sp.common)}</b><small>${F.esc(sp.sci)}</small><div class="meta"><span>${ROLES[sp.role].label}</span><span data-live="pop${sp.idx}">${F.big(Life.pop(sp, App.t))}</span></div></div>`).join('')}</div>
      <div class="sec">Food web</div>
      <canvas id="foodweb" style="width:100%;display:block;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)"></canvas>
      <div class="legend"><span><i style="background:#7dffb0"></i>eats</span><span><i style="background:#ffb45e"></i>scavenges</span><span><i style="background:#9be8ff"></i>decomposes</span></div>
      <div class="sec">Lineages</div>
      <div class="list">${eco.clades.map((c) => `<div class="li" style="cursor:default"><span class="lifedot" style="background:${C.css(c.members[0].ph.primary)}"></span><div class="t"><b><i>${F.esc(c.genus)}</i></b><small>${FAMILIES[c.family].name} · ${c.hab} · diverged ${F.i(c.origin)} Myr ago</small></div><div class="r">${c.members.length} sp.</div></div>`).join('')}</div>
      <div class="sec">Ecological events</div>
      ${ev.map((e) => `<div class="event"><time>D${F.i(Math.floor(e.t))}</time><span>${e.ongoing ? '<b style="color:var(--warn)">Ongoing · </b>' : ''}${e.boom ? 'Population boom' : 'Population crash'} — <a data-act="species" data-arg="${e.sp.code}" style="color:var(--accent);cursor:pointer">${F.esc(e.sp.common)}</a></span></div>`).join('') || '<div class="muted" style="font-size:12px">A period of ecological stability.</div>'}`;
  },
  mountLife(el, P, eco, code) {
    for (const c of el.querySelectorAll('canvas[data-portrait]')) {
      const sp = eco.species[+c.dataset.portrait];
      const x = c.getContext('2d');
      const pc = Creatures.portrait(sp, 150, 112);
      x.drawImage(pc, 0, 0, c.width, c.height);
    }
    const fw = el.querySelector('#foodweb');
    if (fw) Charts.foodWeb(fw, eco, (sp) => UI.speciesModal(sp, P, code));
    const sp = UI.panel.spec;
    const baseLive = sp.live;
    sp.live = () => { const o = baseLive ? baseLive() : {}; for (const s of eco.species) o['pop' + s.idx] = F.big(Life.pop(s, App.t)); return o; };
  },

  /* ---------------------------- surface panel ----------------------------- */
  surfacePanel(v) {
    const P = v.P, code = v.bodyCode;
    UI.panel.set({
      key: 'surface:' + code, group: 'surface', kicker: `Surface · ${P.name}`, title: v.surf.ready ? Biomes.name(v.surf.gas ? B.BAND : v.surf.locInfo(v.cam.lat, v.cam.lon).biome, P) : 'Descending…',
      sub: `${F.lat(v.cam.lat)} ${F.lon(v.cam.lon)}`, icon: UI.planetIcon(P, 50),
      bookmark: { code: Codes.surface(code, v.cam.lat, v.cam.lon), name: `${P.name} · ${F.lat(v.cam.lat)} ${F.lon(v.cam.lon)}`, kind: 'surface' },
      tabs: [{ id: 'here', label: 'Here' }, { id: 'life', label: 'Wildlife' }, { id: 'features', label: 'Landmarks' }],
      refresh: true,
      render: (tab) => {
        if (!v.surf.ready) return '<div class="note">Completing the planetary survey before landing…</div>';
        if (tab === 'life') {
          if (!P.life) return '<div class="empty">No life stirs here.</div>';
          const counts = new Map();
          for (const a of v.agents) counts.set(a.sp, (counts.get(a.sp) || 0) + 1);
          const list = [...counts.entries()].sort((a, b) => b[1] - a[1]);
          const eco = v.eco;
          const hidden = P.biochem === 'subglacial' ? '<div class="note">This biosphere lives in the ocean beneath the ice shell and cannot be observed from the surface.</div>' : '';
          return `${hidden}<div class="sec">In view now</div>${list.length ? `<div class="list">${list.map(([sp, n]) => `<div class="li" data-act="species" data-arg="${sp.code}"><canvas data-mini="${sp.idx}" width="72" height="54" style="width:48px;height:36px;border-radius:8px"></canvas><div class="t"><b>${F.esc(sp.common)}</b><small>${ROLES[sp.role].label} · ${sp.ph.activity}</small></div><div class="r">×${n}</div></div>`).join('')}</div>` : '<div class="muted" style="font-size:12.5px">Nothing moving nearby — try zooming in, waiting for dusk, or moving to another biome.</div>'}
            <div class="sec">Producers & sessile life</div><div class="list">${eco.species.filter((s) => s.role === 'producer' || s.ph.speedMs === 0).slice(0, 8).map((sp) => `<div class="li" data-act="species" data-arg="${sp.code}"><canvas data-mini="${sp.idx}" width="72" height="54" style="width:48px;height:36px;border-radius:8px"></canvas><div class="t"><b>${F.esc(sp.common)}</b><small>${F.esc(sp.sci)}</small></div></div>`).join('')}</div>`;
        }
        if (tab === 'features') {
          const fs = v.surf.features.map((f, i) => ({ f, i, d: Math.hypot(U.wrapDeg(f.lon - v.cam.lon) * Math.cos(v.cam.lat * DEG), f.lat - v.cam.lat) })).sort((a, b) => a.d - b.d).slice(0, 20);
          return `<div class="list">${fs.map(({ f, i, d }) => `<div class="li" data-act="fly" data-arg="${i}"><span class="lifedot" style="background:${C.css(f.color)}"></span><div class="t"><b>${F.esc(f.name)}</b><small>${f.label}${f.pop ? ' · pop. ' + F.big(f.pop) : ''} · ${F.i(d * 111 * P.radius)} km</small></div></div>`).join('') || '<div class="empty">No landmarks surveyed.</div>'}</div>`;
        }
        const I = v.surf.gas ? null : v.surf.locInfo(v.cam.lat, v.cam.lon);
        const hr = Astro.localHour(P, App.t, v.cam.lon), el = Astro.sunElevation(P, App.t, v.cam.lat, v.cam.lon);
        const sf = v.selFeature;
        return `${sf ? `<div class="note" style="margin-bottom:10px"><b style="color:${C.css(sf.color)}">${F.esc(sf.name)}</b><br>${sf.label}${sf.pop ? ` · population ${F.big(sf.pop)}` : ''} · ${F.lat(sf.lat)} ${F.lon(sf.lon)}</div>` : ''}
          <div class="stats">
            ${I ? UI.h.stat(I.water ? 'Depth' : 'Elevation', `${F.i(Math.abs(I.elev))} <small>m</small>`) : UI.h.stat('Altitude', 'Cloud deck')}
            ${UI.h.stat('Temperature', F.tempC(I ? I.T : P.temp))}
            ${I ? UI.h.stat('Moisture', F.pct(I.m)) : UI.h.stat('Pressure', '~1 bar level')}
            ${UI.h.stat('Local time', `${String(Math.floor(hr)).padStart(2, '0')}:${String(Math.floor((hr % 1) * 60)).padStart(2, '0')} <small>${el > 0.05 ? 'day' : el > -0.1 ? 'twilight' : 'night'}</small>`)}
            ${UI.h.stat('Sun elevation', `${F.n(Math.asin(U.clamp(el, -1, 1)) / DEG, 1)}°`)}
            ${UI.h.stat('Weather', v.wx ? { snow: 'Snowfall', rain: 'Rain', mrain: 'Methane rain', ash: 'Ashfall', acid: 'Acid mist', dust: 'Dust storm', wind: 'Jet stream' }[v.wx] : 'Calm')}
            ${UI.h.stat('Creatures in view', F.i(v.agents.length))}
            ${UI.h.stat('Zoom', `${F.i(v.cam.z)} <small>px/°</small>`)}
          </div>
          <div class="btns"><button class="btn grow" data-act="orbit">${UI.icons.globe} Return to orbit</button></div>
          <div class="sec">Location code</div>${UI.h.code(Codes.surface(code, v.cam.lat, v.cam.lon))}`;
      },
      mount: (el) => { for (const c of el.querySelectorAll('canvas[data-mini]')) { const sp = v.eco.species[+c.dataset.mini]; c.getContext('2d').drawImage(Creatures.portrait(sp, 72, 54), 0, 0, c.width, c.height); } },
      actions: { orbit: () => App.back(), fly: (i) => { const f = v.surf.features[+i]; if (f) { v.flyTo(f.lat, f.lon); v.selFeature = f; v.cam.z = Math.max(v.cam.z, 200); UI.panel.select('here'); } } },
    });
  },

  /* ---------------------------- species modal ----------------------------- */
  speciesModal(sp, P, code) {
    const ph = sp.ph, eco = Life.ecosystem(P, code), F1 = FAMILIES[sp.family];
    const d = Store.data.codex;
    if (!d[sp.code]) { d[sp.code] = { n: sp.common, s: sp.sci, f: sp.family, p: P.name, pc: code, t: Date.now() }; Store.save(); UI.badge(); }
    const chip = (s, cls = '') => `<span class="chip ${cls}">${s}</span>`;
    const rel = (ids, label) => ids.length ? `<div style="margin-top:6px"><span class="muted" style="font-size:12px;margin-right:6px">${label}</span>${[...new Set(ids)].map((i) => `<span class="chip link" data-act="sp" data-arg="${i}"><i style="background:${C.css(eco.species[i].ph.primary)}"></i>${F.esc(eco.species[i].common)}</span>`).join('')}</div>` : '';
    const genes = [[1, 'Body size'], [2, 'Elongation'], [5, 'Limb length'], [30, 'Aggression'], [29, 'Sociality'], [32, 'Speed'], [34, 'Cognition'], [35, 'Cold tolerance'], [36, 'Heat tolerance'], [37, 'Toxicity'], [38, 'Camouflage'], [39, 'Bioluminescence'], [42, 'Armor']];
    const siblings = sp.clade.members.filter((m) => m !== sp);
    UI.modal.open({
      title: F.esc(sp.commonFull || sp.common), sub: `<i>${F.esc(sp.sci)}</i> · ${F1.name} · ${F.esc(P.name)}`,
      html: `<canvas class="portrait-big" id="bigPortrait"></canvas>
        <div style="margin:12px 0 4px">${chip(ROLES[sp.role].label, 'violet')}${chip(sp.habitat === 'water' && P.biochem === 'subglacial' ? 'subglacial' : sp.habitat)}${chip(ph.activity)}${sp.sapient ? chip('sapient', 'warn') : ''}${chip(TEXTURES[ph.texture])}${chip(sp.home >= 0 ? Biomes.name(sp.home, P) : 'Subglacial ocean', 'good')}</div>
        <p class="desc">${F.esc(sp.desc)}</p>
        <div class="d-grid">
          <div>
            <div class="sec">Vital statistics</div>
            <div class="stats">
              ${UI.h.stat('Size', F.size(ph.size))}${UI.h.stat('Mass', F.mass(ph.mass))}
              ${UI.h.stat('Top speed', ph.speedMs ? `${F.n(ph.speedMs * 3.6, 1)} <small>km/h</small>` : 'Sessile')}${UI.h.stat('Lifespan', `${F.n(ph.life, 1)} <small>yr</small>`)}
              ${UI.h.stat('Population', `<span id="spPop">${F.big(Life.pop(sp, App.t))}</span>`)}${UI.h.stat('Trophic level', F.n(sp.tl, 1))}
            </div>
            <div class="sec">Population · last 3 local years</div>
            <canvas class="spark" id="spSpark"></canvas>
            <div class="sec">Adaptations</div>
            <div>${sp.adapt.map((a) => chip(a, 'good')).join('') || '<span class="muted">Generalist body plan.</span>'}</div>
            <div class="sec">Ecology</div>
            ${rel(sp.prey, sp.role === 'decomp' ? 'Breaks down' : sp.role === 'scav' ? 'Scavenges' : 'Eats')}${rel(sp.predators, 'Hunted by')}
            ${siblings.length ? `<div style="margin-top:6px"><span class="muted" style="font-size:12px;margin-right:6px">Relatives</span>${siblings.map((m) => `<span class="chip link" data-act="sp" data-arg="${m.idx}">${F.esc(m.common)} · ${F.pct(Life.similarity(sp, m))}</span>`).join('')}</div>` : ''}
          </div>
          <div>
            <div class="sec">Genome · 192 bases</div>
            <canvas class="dna" id="dnaStrip"></canvas>
            <div class="mono muted" style="font-size:10px;word-break:break-all;margin:6px 0 10px;line-height:1.35;user-select:all">${Life.dnaString(sp.genome).replace(/(.{48})/g, '$1 ')}</div>
            ${genes.map(([i, n]) => `<div class="gene-row"><span>${n}</span>${UI.h.bar(sp.genome[i] / 255, `hsl(${190 - sp.genome[i] * 0.5},80%,60%)`)}<span>${sp.genome[i]}</span></div>`).join('')}
            <div class="sec">Species code</div>${UI.h.code(sp.code)}
          </div>
        </div>`,
      actions: { sp: (i) => UI.speciesModal(eco.species[+i], P, code) },
      mount: (el) => {
        const c = el.querySelector('#bigPortrait');
        const w = c.clientWidth || 600, h = Math.round(w * 0.62), dpr = Math.min(2, App.dpr);
        c.width = w * dpr; c.height = h * dpr;
        const x = c.getContext('2d');
        let alive = true;
        const loop = (ts) => {
          if (!alive || !document.body.contains(c)) return;
          x.setTransform(dpr, 0, 0, dpr, 0, 0);
          Creatures.paintScene(x, sp, w, h, App.settings.reduceMotion ? 0.15 : (ts / 1000) * (0.35 + ph.speed * 0.5) % 1, true);
          const pe = el.querySelector('#spPop'); if (pe) pe.textContent = F.big(Life.pop(sp, App.t));
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
        UI.modal.cur.onClose = () => { alive = false; };
        const vals = [];
        const span = Math.max(30, P.yearDays * 3);
        for (let i = 0; i <= 120; i++) vals.push(Life.pop(sp, App.t - span + (span * i) / 120));
        Charts.spark(el.querySelector('#spSpark'), vals, C.css(ph.primary));
        Charts.dna(el.querySelector('#dnaStrip'), sp.genome);
      },
    });
  },

  /* ------------------------------ seed lab -------------------------------- */
  openLab() {
    const targets = [['any', 'Any system'], ['life', 'Life-bearing'], ['complex', 'Complex life'], ['sapient', 'Sapient species'], ['earthlike', 'Earth-like world'], ['ocean', 'Ocean world'], ['rings', 'Ringed giant'], ['ruins', 'Ancient ruins'], ['lava', 'Volcanic world'], ['crystal', 'Crystalline world']];
    const test = (t, P) => t === 'any' || (t === 'rings' ? P.rings && P.giant : CRITERIA.find((c) => c.id === t).t(P));
    UI.modal.open({
      title: 'Seed lab', sub: 'Grow entire star systems from any word — the same seed always yields the same worlds', icon: UI.icons.dice.replace('<svg', '<svg width="22" height="22" style="color:var(--accent-2)"'),
      html: `<div class="field"><label>Seed text</label><div class="row"><input class="input mono" id="lseed" placeholder="e.g. HELLO-WORLD" autocomplete="off" spellcheck="false" autofocus><button class="icon-btn" data-act="roll" title="Random seed">${UI.icons.dice}</button></div></div>
        <div class="field"><label>Must contain</label><select class="input" id="ltarget">${targets.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
        <div class="btns"><button class="btn primary grow" data-act="gen">${UI.icons.dice} Generate system</button></div>
        <div id="lout" style="margin-top:14px"></div>
        <div class="sec">How seeds work</div>
        <p class="desc" style="font-size:12.5px">Your text is normalised (A–Z, 0–9, dashes) and hashed with cyrb53 into a 32-bit system seed. Every star, orbit, planet, heightmap, river and genome below it is derived by forking that seed into independent sfc32 random streams. If a variant must be searched for, the lab tries <span class="mono">SEED</span>, <span class="mono">SEED-2</span>, <span class="mono">SEED-3</span>… and reports the exact code it found.</p>`,
      actions: {
        roll: () => { const r = new RNG((Math.random() * 2 ** 32) >>> 0); document.getElementById('lseed').value = (Names.word(r, 2, 3) + '-' + r.int(10, 999)).toUpperCase(); },
        gen: () => {
          const raw = Codes.cleanSeed(document.getElementById('lseed').value) || 'GENESIS';
          const t = document.getElementById('ltarget').value, out = document.getElementById('lout');
          let found = null, tries = 0;
          for (let i = 1; i <= 300 && !found; i++) {
            tries = i;
            const s = i === 1 ? raw : `${raw}-${i}`.slice(0, 32);
            const sys = World.system(Codes.custom(s));
            const bodies = []; sys.planets.forEach((P) => { bodies.push(P); P.moons.forEach((M) => bodies.push(M)); });
            const hit = bodies.find((P) => test(t, P));
            if (hit || (t === 'any')) found = { sys, hit: hit || null };
          }
          if (!found) { out.innerHTML = '<div class="empty">No match within 300 variants — try another seed or target.</div>'; return; }
          const sys = found.sys;
          out.innerHTML = `<div class="note" style="margin-bottom:10px">${tries > 1 ? `Found after ${tries} variants. ` : ''}System <b>${F.esc(sys.name)}</b> · ${sys.star.label} · ${sys.planets.length} planets${found.hit ? ` · match: <b>${F.esc(found.hit.name)}</b>` : ''}</div>
            ${UI.h.code(sys.code)}
            <div class="btns"><button class="btn primary grow" data-act="go" data-arg="${sys.code}">${UI.icons.enter} Visit system</button>${found.hit ? `<button class="btn grow" data-act="go" data-arg="${World.bodyCode(sys, found.hit)}">${UI.icons.globe} Visit ${F.esc(found.hit.name)}</button>` : ''}</div>
            <div class="sec">Bodies</div>${UI.planetList(sys, null, false).replace(/data-act="body"/g, 'data-act="go"')}`;
          UI.mountThumbs(out);
        },
      },
      mount: (el) => { el.querySelector('#lseed').addEventListener('keydown', (e) => { if (e.key === 'Enter') UI.modal.cur.actions.gen(); }); },
    });
  },

  /* ------------------------------- codex ---------------------------------- */
  openCodex() {
    const entries = Object.entries(Store.data.codex).sort((a, b) => b[1].t - a[1].t);
    const groups = new Map();
    for (const [code, e] of entries) { const k = e.pc; if (!groups.has(k)) groups.set(k, { name: e.p, list: [] }); groups.get(k).list.push({ code, ...e }); }
    UI.modal.open({
      title: 'Xenobiology codex', sub: `${entries.length} species catalogued across ${groups.size} worlds`, icon: UI.icons.dna.replace('<svg', '<svg width="22" height="22" style="color:var(--good)"'),
      html: entries.length ? [...groups.entries()].map(([pc, g]) => `<div class="sec">${F.esc(g.name)} <button class="chip link" data-act="go" data-arg="${F.esc(pc)}" style="margin:0 0 0 6px">visit</button></div><div class="cards">${g.list.map((e) => `<div class="card" data-act="species" data-arg="${F.esc(e.code)}"><canvas data-codex="${F.esc(e.code)}" width="300" height="225"></canvas><b>${F.esc(e.n)}</b><small>${F.esc(e.s)}</small><div class="meta"><span>${FAMILIES[e.f] ? FAMILIES[e.f].name : ''}</span><span>${F.ago(e.t)}</span></div></div>`).join('')}</div>`).join('') : '<div class="empty">Your codex is empty.<br>Visit a living world and its species are catalogued automatically.</div>',
      mount: (el) => {
        const cvs = [...el.querySelectorAll('canvas[data-codex]')];
        let i = 0;
        const step = () => {
          const end = performance.now() + 12;
          while (i < cvs.length && performance.now() < end) {
            const c = cvs[i++], [pc, idx] = c.dataset.codex.split('#'), r = World.body(pc);
            if (!r) continue;
            const sp = Life.ecosystem(r.body, r.code).species[+idx];
            if (sp) c.getContext('2d').drawImage(Creatures.portrait(sp, 150, 112), 0, 0, c.width, c.height);
          }
          if (i < cvs.length && UI.modal.isOpen) requestAnimationFrame(step);
        };
        step();
      },
    });
  },
